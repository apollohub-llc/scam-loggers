<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apollo Mobile Injector</title>
    <style>
        body { margin:0; background: #000; color: #ff6600; font-family: sans-serif; overflow: hidden; }
        #toolbar { padding: 10px; background: #111; border-bottom: 2px solid #ff6600; display: flex; flex-direction: column; gap: 5px; }
        #preview-wrapper { width: 100%; height: calc(100vh - 120px); border: none; overflow: hidden; transition: width 0.3s ease; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        textarea { width: 100%; height: 60px; background: #000; color: #ff6600; border: 1px solid #ff6600; font-family: monospace; box-sizing: border-box; }
        .btn-group { display: flex; gap: 5px; }
        .btn { cursor: pointer; background: #ff6600; color: #000; border: none; padding: 10px; font-weight: bold; flex: 1; }
    </style>
</head>
<body>

<div id="toolbar">
    <textarea id="htmlInput" placeholder="Paste your HTML here..."></textarea>
    <div class="btn-group">
        <button class="btn" onclick="inject()">Inject</button>
        <button class="btn" onclick="toggleView()">Toggle View</button>
        <button class="btn" onclick="exportCode()">Export</button>
    </div>
</div>

<!-- Added native sandbox restriction to block external scripts and redirects -->
<div id="preview-wrapper">
    <iframe id="renderFrame" sandbox="allow-same-origin"></iframe>
</div>

<script>
    const frame = document.getElementById('renderFrame');
    const wrapper = document.getElementById('preview-wrapper');
    const inputArea = document.getElementById('htmlInput');

    function inject() {
        const content = inputArea.value;
        const doc = frame.contentDocument || frame.contentWindow.document;
        
        // Injected rules force a strict viewport, downsize badges, and disable button actions natively via CSS
        const forceStyles = `
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <style>
                html, body { touch-action: manipulation !important; -webkit-user-select: none !important; user-select: none !important; overscroll-behavior: none !important; }
                
                /* Disable links, button animations, and standard clicks so they act like plain text containers */
                a, button, input, select, textarea { pointer-events: none !important; cursor: default !important; }
                
                .apollo-comment-badge {
                    background: #ff6600 !important;
                    color: #000 !important;
                    font-size: 9px !important;
                    line-height: 10px !important;
                    font-family: monospace !important;
                    font-weight: bold !important;
                    padding: 1px 3px !important;
                    border-radius: 2px !important;
                    display: inline-block !important;
                    margin: 2px !important;
                    vertical-align: middle !important;
                    max-height: 12px !important;
                    text-transform: none !important;
                    letter-spacing: 0 !important;
                    outline: none !important;
                    pointer-events: none !important; /* Prevents badge from breaking selection triggers */
                }
            </style>
        `;
        
        let fullContent = content;
        if (/<head>/i.test(fullContent)) {
            fullContent = fullContent.replace(/<head>/i, '<head>' + forceStyles);
        } else {
            fullContent = forceStyles + fullContent;
        }
        
        doc.open();
        doc.write(fullContent);
        doc.close();

        // Strict event interception layer to freeze form submittal and click redirects
        const win = frame.contentWindow;
        const killEvent = (e) => { e.preventDefault(); e.stopPropagation(); };
        win.addEventListener('click', killEvent, true);
        win.addEventListener('submit', killEvent, true);

        // Double-tap handler to target and add comment safely
        let lastTap = 0;
        doc.body.addEventListener('touchend', (e) => {
            if (e.target.classList.contains('apollo-comment-badge')) return;

            const now = Date.now();
            if (now - lastTap < 300) {
                e.preventDefault();
                
                const commentText = prompt("Enter your comment to save:");
                if (commentText && commentText.trim() !== "") {
                    
                    // 1. Visually display micro comment badge inside the frozen preview element
                    const badge = doc.createElement('span');
                    badge.className = 'apollo-comment-badge';
                    badge.innerText = `[# ${commentText}]`;
                    e.target.parentNode.insertBefore(badge, e.target);
                    e.target.style.outline = "1px solid #ff6600";

                    // 2. Permanently update the comment in the source textarea code block
                    const targetOuterHTML = e.target.outerHTML;
                    const currentSource = inputArea.value;
                    const htmlComment = `<!-- Comment: ${commentText} -->\n`;

                    if (currentSource.includes(targetOuterHTML)) {
                        inputArea.value = currentSource.replace(targetOuterHTML, htmlComment + targetOuterHTML);
                    } else {
                        const sampleIdentifier = e.target.innerText ? e.target.innerText.trim().substring(0, 20) : '';
                        if (sampleIdentifier && currentSource.includes(sampleIdentifier)) {
                            const position = currentSource.indexOf(sampleIdentifier);
                            const tagStart = currentSource.lastIndexOf('<', position);
                            if (tagStart !== -1) {
                                inputArea.value = currentSource.slice(0, tagStart) + htmlComment + currentSource.slice(tagStart);
                            }
                        } else {
                            inputArea.value = currentSource + `\n${htmlComment}`;
                        }
                    }
                }
            }
            lastTap = now;
        }, { passive: false });
    }

    function toggleView() {
        wrapper.style.width = (wrapper.style.width === '375px') ? '100%' : '375px';
    }

    function exportCode() {
        const sourceCode = inputArea.value;
        if (!sourceCode.trim()) {
            alert("No source code available to copy.");
            return;
        }
        
        navigator.clipboard.writeText(sourceCode).then(() => {
            alert("Updated code with saved comments copied directly from input!");
        }).catch(err => {
            alert("Error copying code to clipboard: " + err);
        });
    }
</script>
</body>
</html>
