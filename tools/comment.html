<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apollo Mobile Injector</title>
    <style>
        body { margin:0; background: #000; color: #ff6600; font-family: sans-serif; overflow: hidden; }
        #toolbar { padding: 10px; background: #111; border-bottom: 2px solid #ff6600; display: flex; flex-direction: column; gap: 5px; }
        #preview-wrapper { width: 100%; height: calc(100vh - 120px); border: none; overflow: hidden; transition: width 0.3s ease; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        textarea { width: 100%; height: 60px; background: #000; color: #ff6600; border: 1px solid #ff6600; font-family: monospace; box-sizing: border-box; }
        .btn-group { display: flex; gap: 5px; }
        .btn { cursor: pointer; background: #ff6600; color: #000; border: none; padding: 10px; font-weight: bold; flex: 1; }
    </style>
</head>
<body>

<div id="toolbar">
    <textarea id="htmlInput" placeholder="Paste your HTML here..."></textarea>
    <div class="btn-group">
        <button class="btn" onclick="inject()">Inject</button>
        <button class="btn" onclick="toggleView()">Toggle View</button>
        <button class="btn" onclick="exportCode()">Export</button>
    </div>
</div>

<div id="preview-wrapper"><iframe id="renderFrame"></iframe></div>

<script>
    const frame = document.getElementById('renderFrame');
    const wrapper = document.getElementById('preview-wrapper');
    const inputArea = document.getElementById('htmlInput');

    function inject() {
        const content = inputArea.value;
        const doc = frame.contentDocument || frame.contentWindow.document;
        
        const forceStyles = `
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <style>
                html, body { touch-action: manipulation !important; -webkit-user-select: none !important; user-select: none !important; overscroll-behavior: none !important; position: relative; }
                a, button, input, select, textarea { pointer-events: none !important; cursor: default !important; }
                
                /* Badges float strictly above elements without pushing layout content around */
                .apollo-comment-badge {
                    position: absolute !important;
                    background: #ff6600 !important;
                    color: #000 !important;
                    font-size: 9px !important;
                    line-height: 10px !important;
                    font-family: monospace !important;
                    font-weight: bold !important;
                    padding: 1px 3px !important;
                    border-radius: 2px !important;
                    z-index: 2147483647 !important;
                    transform: translateY(-100%) !important;
                    margin-top: -2px !important;
                    white-space: nowrap !important;
                    pointer-events: auto !important; /* Allows clicking/holding to delete badge */
                    cursor: pointer !important;
                }
            </style>
        `;
        
        let fullContent = content;
        if (/<head>/i.test(fullContent)) {
            fullContent = fullContent.replace(/<head>/i, '<head>' + forceStyles);
        } else {
            fullContent = forceStyles + fullContent;
        }
        
        doc.open();
        doc.write(fullContent);
        doc.close();

        const win = frame.contentWindow;
        const killEvent = (e) => { e.preventDefault(); e.stopPropagation(); };
        win.addEventListener('submit', killEvent, true);

        // Double-tap handler to add comment badges strictly above an element
        let lastTap = 0;
        doc.body.addEventListener('touchend', (e) => {
            if (e.target.classList.contains('apollo-comment-badge') || e.target === doc.body || e.target === doc.documentElement) return;

            const now = Date.now();
            if (now - lastTap < 300) {
                e.preventDefault();
                
                const commentText = prompt("Enter your comment to save:");
                if (commentText && commentText.trim() !== "") {
                    const commentId = "c" + Date.now();
                    
                    // 1. Position calculation to hover strictly above the target element
                    const rect = e.target.getBoundingClientRect();
                    const scrollTop = win.pageYOffset || doc.documentElement.scrollTop;
                    const scrollLeft = win.pageXOffset || doc.documentElement.scrollLeft;

                    const badge = doc.createElement('span');
                    badge.className = 'apollo-comment-badge';
                    badge.id = commentId;
                    badge.innerText = `[# ${commentText}]`;
                    
                    // Assign absolute coordinate positioning markers
                    badge.style.top = `${rect.top + scrollTop}px`;
                    badge.style.left = `${rect.left + scrollLeft}px`;
                    
                    doc.body.appendChild(badge);
                    e.target.style.outline = "1px solid #ff6600";

                    // 2. Insert comment with unique tracking ID directly into the source textarea
                    const targetOuterHTML = e.target.outerHTML;
                    const currentSource = inputArea.value;
                    const htmlComment = `<!-- ID: ${commentId} | Comment: ${commentText} -->\n`;

                    if (currentSource.includes(targetOuterHTML)) {
                        inputArea.value = currentSource.replace(targetOuterHTML, htmlComment + targetOuterHTML);
                    } else {
                        inputArea.value = currentSource + `\n${htmlComment}`;
                    }
                }
            }
            lastTap = now;
        }, { passive: false });

        // Deletion Handler: Listens for contextmenu (right-click or long-press on mobile devices)
        doc.body.addEventListener('contextmenu', (e) => {
            if (e.target.classList.contains('apollo-comment-badge')) {
                e.preventDefault();
                
                if (confirm("Delete this comment tag?")) {
                    const targetId = e.target.id;
                    
                    // 1. Remove the visual tag element from canvas layout view
                    e.target.remove();
                    
                    // 2. Instantly look up code block matching ID and scrub it out of the textarea
                    const currentSource = inputArea.value;
                    const commentRegex = new RegExp(`<!-- ID: ${targetId} \\| Comment: .*? -->\\n?`, 'g');
                    inputArea.value = currentSource.replace(commentRegex, '');
                }
            }
        });
    }

    function toggleView() {
        wrapper.style.width = (wrapper.style.width === '375px') ? '100%' : '375px';
    }

    function exportCode() {
        let sourceCode = inputArea.value;
        if (!sourceCode.trim()) {
            alert("No source code available to copy.");
            return;
        }
        
        // Clean up tracking IDs before exporting clean production comments
        sourceCode = sourceCode.replace(/<!-- ID: c\d+ \| Comment: (.*?) -->/g, '<!-- Comment: $1 -->');
        
        navigator.clipboard.writeText(sourceCode).then(() => {
            alert("Clean production code copied!");
        }).catch(err => {
            alert("Error copying code: " + err);
        });
    }
</script>
</body>
</html>
