<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apollo Injector - Mobile Optimized</title>
    <style>
        body { margin:0; background: #000; color: #ff6600; font-family: sans-serif; }
        #toolbar { padding: 10px; background: #111; border-bottom: 2px solid #ff6600; display: flex; gap: 5px; flex-wrap: wrap; }
        #preview-wrapper { width: 100%; height: calc(100vh - 100px); border: none; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        textarea { width: 100%; height: 60px; background: #000; color: #ff6600; border: 1px solid #ff6600; }
        .btn { cursor: pointer; background: #ff6600; color: #000; border: none; padding: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div id="toolbar">
    <textarea id="htmlInput" placeholder="Paste full HTML here..."></textarea>
    <button class="btn" onclick="inject()">Inject</button>
    <button class="btn" onclick="toggleView()">Toggle Desktop/Mobile</button>
    <button class="btn" onclick="exportCode()">Export</button>
</div>

<div id="preview-wrapper"><iframe id="renderFrame"></iframe></div>

<script>
    const frame = document.getElementById('renderFrame');
    const wrapper = document.getElementById('preview-wrapper');

    function inject() {
        const content = document.getElementById('htmlInput').value;
        const doc = frame.contentDocument || frame.contentWindow.document;
        
        // Injecting the meta tag to prevent zoom
        const metaTag = '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">';
        const fullContent = content.replace(/<head>/i, '<head>' + metaTag);
        
        doc.open();
        doc.write(fullContent);
        doc.close();

        let lastTap = 0;
        doc.body.addEventListener('pointerdown', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
                e.preventDefault();
                const comment = prompt("Enter a comment:");
                if (comment) e.target.setAttribute('data-comment', comment);
            }
            lastTap = now;
        }, { passive: false });
    }

    function toggleView() {
        wrapper.style.width = (wrapper.style.width === '600px') ? '100%' : '600px';
    }

    function exportCode() {
        const doc = frame.contentDocument;
        const elements = doc.querySelectorAll('[data-comment]');
        elements.forEach(el => {
            const comment = el.getAttribute('data-comment');
            el.prepend(document.createComment(` Comment: ${comment} `));
            el.removeAttribute('data-comment');
        });
        navigator.clipboard.writeText(doc.documentElement.outerHTML);
        alert("Copied to clipboard!");
    }
</script>
</body>
</html>
