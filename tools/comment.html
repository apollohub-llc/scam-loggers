<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apollo Mobile Injector</title>
    <style>
        body { margin:0; background: #000; color: #ff6600; font-family: sans-serif; overflow: hidden; }
        #toolbar { padding: 10px; background: #111; border-bottom: 2px solid #ff6600; display: flex; flex-direction: column; gap: 5px; }
        #preview-wrapper { width: 100%; height: calc(100vh - 120px); border: none; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        textarea { width: 100%; height: 60px; background: #000; color: #ff6600; border: 1px solid #ff6600; }
        .btn-group { display: flex; gap: 5px; }
        .btn { cursor: pointer; background: #ff6600; color: #000; border: none; padding: 10px; font-weight: bold; flex: 1; }
    </style>
</head>
<body>

<div id="toolbar">
    <textarea id="htmlInput" placeholder="Paste your HTML here..."></textarea>
    <div class="btn-group">
        <button class="btn" onclick="inject()">Inject</button>
        <button class="btn" onclick="toggleView()">Toggle View</button>
        <button class="btn" onclick="exportCode()">Export</button>
    </div>
</div>

<div id="preview-wrapper"><iframe id="renderFrame"></iframe></div>

<script>
    const frame = document.getElementById('renderFrame');
    const wrapper = document.getElementById('preview-wrapper');

    function inject() {
        const content = document.getElementById('htmlInput').value;
        const doc = frame.contentDocument || frame.contentWindow.document;
        
        // Force these settings into the injected HTML to stop mobile zooming
        const forceStyles = `
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <style>
                html, body { touch-action: manipulation !important; -webkit-user-select: none !important; user-select: none !important; overscroll-behavior: none !important; }
            </style>
        `;
        
        const fullContent = content.replace(/<head>/i, '<head>' + forceStyles);
        
        doc.open();
        doc.write(fullContent);
        doc.close();

        // Handle double-tap
        let lastTap = 0;
        doc.body.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
                e.preventDefault();
                const comment = prompt("Enter a comment:");
                if (comment) {
                    e.target.setAttribute('data-comment', comment);
                    e.target.style.outline = "2px solid #ff6600";
                }
            }
            lastTap = now;
        }, { passive: false });
    }

    function toggleView() {
        wrapper.style.width = (wrapper.style.width === '600px') ? '100%' : '600px';
    }

    function exportCode() {
        const doc = frame.contentDocument;
        const elements = doc.querySelectorAll('[data-comment]');
        elements.forEach(el => {
            const comment = el.getAttribute('data-comment');
            // Create comment node
            const cNode = doc.createComment(` Comment: ${comment} `);
            el.prepend(cNode);
            el.removeAttribute('data-comment');
            el.style.outline = "";
        });
        
        // Remove our injected styles before copying
        const styles = doc.querySelectorAll('style');
        styles.forEach(s => s.remove());
        
        const code = doc.documentElement.outerHTML;
        navigator.clipboard.writeText(code).then(() => alert("Code with comments copied!"));
    }
</script>
</body>
</html>
