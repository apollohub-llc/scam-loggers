<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Hub - Proxy Sandbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: radial-gradient(circle at center, #1a0f05 0%, #0a0500 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff6600;
            box-shadow: 0 0 15px rgba(255,102,0,0.3);
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,102,0,0.7);
        }

        .status-badge {
            background: rgba(255,102,0,0.1);
            border: 1px solid #ff6600;
            color: #ffaa66;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .iframe-container {
            flex: 1;
            border: 2px solid #ff6600;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255,102,0,0.15);
            position: relative;
            overflow: hidden;
            background: #fff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(10,5,0,0.92);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #ff6600;
        }
        .overlay.active { display: flex; }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,102,0,0.2);
            border-top-color: #ff6600;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .overlay-msg {
            font-size: 0.88rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ff8844;
            max-width: 340px;
            text-align: center;
            line-height: 1.6;
        }

        .overlay-sub {
            font-size: 0.75rem;
            color: #aa5522;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .overlay.error .spinner { display: none; }
        .overlay.error .overlay-msg { color: #ff4422; }
        .overlay.error .overlay-sub { color: #882211; }

        .retry-btn {
            display: none;
            background: transparent;
            border: 1px solid #ff4422;
            color: #ff4422;
            padding: 6px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .overlay.error .retry-btn { display: inline-block; }
        .retry-btn:hover { background: rgba(255,68,34,0.1); }

        .control-bar {
            background: rgba(10,5,0,0.8);
            border: 1px solid #ff6600;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 0 15px rgba(255,102,0,0.1);
        }

        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .url-input {
            flex: 1;
            height: 42px;
            background: #140b02;
            border: 1px solid #ff6600;
            border-radius: 4px;
            color: #fff;
            padding: 10px 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            outline: none;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .url-input:focus {
            border-color: #ff8833;
            box-shadow: 0 0 10px rgba(255,136,51,0.5);
        }

        .launch-btn {
            background: #ff6600;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 0 24px;
            height: 42px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 10px rgba(255,102,0,0.4);
            white-space: nowrap;
        }
        .launch-btn:hover { background: #ff8833; box-shadow: 0 0 15px rgba(255,136,51,0.7); }
        .launch-btn:active { transform: scale(0.98); }
        .launch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: #aa6633;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #proxy-status { color: #ff8844; }
    </style>
</head>
<body>

<header>
    <h1>Apollo Hub // Proxy Sandbox</h1>
    <div class="status-badge">Bypass Enabled</div>
</header>

<div class="workspace">
    <div class="iframe-container">
        <div class="overlay active" id="overlay">
            <div class="spinner" id="overlay-spinner" style="display:none"></div>
            <div class="overlay-msg" id="overlay-msg">Enter a URL and press Execute</div>
            <div class="overlay-sub" id="overlay-sub">Auto-cycles through 5 proxies on failure</div>
            <button class="retry-btn" id="retry-btn">Retry</button>
        </div>
        <iframe id="sandbox-frame"
            sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-downloads"
            src="about:blank">
        </iframe>
    </div>

    <div class="control-bar">
        <div class="control-row">
            <input
                id="url-input"
                class="url-input"
                type="text"
                placeholder="Enter URL (e.g., example.com)..." />
            <button id="load-btn" class="launch-btn">Execute</button>
        </div>
        <div class="info-row">
            <span>Auto-cycles proxies on failure</span>
            <span id="proxy-status">Idle</span>
        </div>
    </div>
</div>

<script>
const PROXIES = [
    {
        name: 'CORSProxy.io',
        build: url => `https://corsproxy.io/?${encodeURIComponent(url)}`
    },
    {
        name: 'AllOrigins',
        build: url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
    },
    {
        name: 'ThingProxy',
        build: url => `https://thingproxy.freeboard.io/fetch/${url}`
    },
    {
        name: 'CORS.sh',
        build: url => `https://proxy.cors.sh/${url}`
    },
    {
        name: 'CodeTabs',
        build: url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
    },
];

const urlInput     = document.getElementById('url-input');
const loadBtn      = document.getElementById('load-btn');
const frame        = document.getElementById('sandbox-frame');
const overlay      = document.getElementById('overlay');
const overlayMsg   = document.getElementById('overlay-msg');
const overlaySub   = document.getElementById('overlay-sub');
const overlaySpinner = document.getElementById('overlay-spinner');
const retryBtn     = document.getElementById('retry-btn');
const proxyStatus  = document.getElementById('proxy-status');

let lastUrl = null;
let currentBlobUrl = null;

function setLoading(msg, sub) {
    overlay.className = 'overlay active';
    overlaySpinner.style.display = '';
    retryBtn.style.display = 'none';
    overlayMsg.textContent = msg;
    overlaySub.textContent = sub;
}

function setError(msg, sub) {
    overlay.className = 'overlay active error';
    overlayMsg.textContent = msg;
    overlaySub.textContent = sub;
}

function hideOverlay() {
    overlay.className = 'overlay';
}

function freePrevBlob() {
    if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
    }
}

function injectBase(html, siteUrl) {
    try {
        const origin = new URL(siteUrl).origin + '/';
        const tag = `<base href="${origin}">`;
        if (/<head(\s[^>]*)?>/.test(html)) {
            return html.replace(/<head(\s[^>]*)?>/, m => m + tag);
        }
        return tag + html;
    } catch {
        return html;
    }
}

async function tryProxy(proxy, targetUrl) {
    const proxyUrl = proxy.build(targetUrl);
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 14000);

    let res;
    try {
        res = await fetch(proxyUrl, { signal: controller.signal });
    } finally {
        clearTimeout(timeout);
    }

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const html = await res.text();
    if (!html || html.trim().length < 50) throw new Error('Empty response');

    // Detect proxy-level error pages
    const preview = html.slice(0, 600).toLowerCase();
    if (html.length < 600 && (preview.includes('error') || preview.includes('denied') || preview.includes('blocked'))) {
        throw new Error('Proxy error page returned');
    }

    return injectBase(html, targetUrl);
}

async function navigateFrame() {
    let targetUrl = urlInput.value.trim();
    if (!targetUrl) return;

    if (!/^https?:\/\//i.test(targetUrl)) targetUrl = 'https://' + targetUrl;
    urlInput.value = targetUrl;
    lastUrl = targetUrl;

    loadBtn.disabled = true;
    freePrevBlob();
    frame.src = 'about:blank';

    let lastErr = null;

    for (let i = 0; i < PROXIES.length; i++) {
        const proxy = PROXIES[i];
        setLoading(`Proxy ${i + 1}/${PROXIES.length} — ${proxy.name}`, 'Fetching…');
        proxyStatus.textContent = `Trying ${proxy.name}…`;

        try {
            const html = await tryProxy(proxy, targetUrl);
            const blob = new Blob([html], { type: 'text/html; charset=utf-8' });
            currentBlobUrl = URL.createObjectURL(blob);
            frame.src = currentBlobUrl;
            proxyStatus.textContent = `✓ ${proxy.name}`;
            hideOverlay();
            loadBtn.disabled = false;
            return;
        } catch (err) {
            lastErr = err;
            proxyStatus.textContent = `✗ ${proxy.name}: ${err.message}`;
            await new Promise(r => setTimeout(r, 300));
        }
    }

    setError('All proxies failed for this URL.', lastErr?.message || 'Unknown error');
    proxyStatus.textContent = 'All failed';
    loadBtn.disabled = false;
}

loadBtn.addEventListener('click', navigateFrame);
urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); navigateFrame(); }
});
retryBtn.addEventListener('click', () => {
    if (lastUrl) { urlInput.value = lastUrl; navigateFrame(); }
});
</script>
</body>
</html>
