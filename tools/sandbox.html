<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Hub - Proxy Sandbox Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a0f05 0%, #0a0500 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        /* Header Area */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff6600;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.7);
        }

        .status-badge {
            background: rgba(255, 102, 0, 0.1);
            border: 1px solid #ff6600;
            color: #ffaa66;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            box-shadow: inset 0 0 5px rgba(255, 102, 0, 0.2);
        }

        /* Main Workspace Content Layout */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }

        /* Iframe Frame container */
        .iframe-container {
            flex: 1;
            background: #ffffff;
            border: 2px solid #ff6600;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* Sandbox Iframe Configuration */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Control Bar Area underneath the frame */
        .control-bar {
            background: rgba(10, 5, 0, 0.8);
            border: 1px solid #ff6600;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.1);
        }

        /* Custom URL textareabar styled to match theme */
        .url-textarea {
            flex: 1;
            height: 42px;
            background: #140b02;
            border: 1px solid #ff6600;
            border-radius: 4px;
            color: #ffffff;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            resize: none;
            white-space: nowrap;
            overflow: hidden;
            outline: none;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .url-textarea:focus {
            border-color: #ff8833;
            box-shadow: 0 0 10px rgba(255, 136, 51, 0.5);
        }

        /* Action Launch Button */
        .launch-btn {
            background: #ff6600;
            border: none;
            color: #000000;
            font-weight: bold;
            padding: 0 24px;
            height: 42px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.4);
        }

        .launch-btn:hover {
            background: #ff8833;
            box-shadow: 0 0 15px rgba(255, 136, 51, 0.7);
        }

        .launch-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
        <h1>Apollo Hub // Proxy Sandbox</h1>
        <div class="status-badge">Bypass Enabled</div>
    </header>

    <div class="workspace">
        <div class="iframe-container">
            <!-- 
              Omitting allow-top-navigation forces redirects to stay inside the frame.
              Added allow-downloads and updated script options to support webapp mechanics.
            -->
            <iframe 
                id="sandbox-frame" 
                sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-downloads"
                src="about:blank">
            </iframe>
        </div>

        <div class="control-bar">
            <textarea 
                id="url-input" 
                class="url-textarea" 
                placeholder="Enter URL (e.g., roblox.com)..." 
                rows="1"></textarea>
            <button id="load-btn" class="launch-btn">Execute</button>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('url-input');
        const loadBtn = document.getElementById('load-btn');
        const sandboxFrame = document.getElementById('sandbox-frame');

        // Using a reliable node-based reverse proxy gateway to clean strict headers
        const PROXY_GATEWAY = 'https://api.allorigins.win/raw?url=';

        function navigateFrame() {
            let targetUrl = urlInput.value.trim();
            
            if (!targetUrl) return;

            // Enforce protocol prefix formatting
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }

            urlInput.value = targetUrl;

            // Route via gateway to strip anti-framing headers (X-Frame-Options/CSP)
            sandboxFrame.src = PROXY_GATEWAY + encodeURIComponent(targetUrl);
        }

        loadBtn.addEventListener('click', navigateFrame);

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                navigateFrame();
            }
        });
    </script>
</body>
</html>
