<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Hub - Proxy Sandbox Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a0f05 0%, #0a0500 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff6600;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.7);
        }

        .status-badge {
            background: rgba(255, 102, 0, 0.1);
            border: 1px solid #ff6600;
            color: #ffaa66;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            box-shadow: inset 0 0 5px rgba(255, 102, 0, 0.2);
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }

        .iframe-container {
            flex: 1;
            background: #ffffff;
            border: 2px solid #ff6600;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(10, 5, 0, 0.85);
            z-index: 10;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            color: #ff6600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 102, 0, 0.2);
            border-top-color: #ff6600;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error message bar */
        .error-bar {
            display: none;
            background: rgba(180, 30, 0, 0.2);
            border: 1px solid #cc3300;
            color: #ff6644;
            border-radius: 4px;
            padding: 8px 14px;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
        }

        .error-bar.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .control-bar {
            background: rgba(10, 5, 0, 0.8);
            border: 1px solid #ff6600;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.1);
        }

        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .url-textarea {
            flex: 1;
            height: 42px;
            background: #140b02;
            border: 1px solid #ff6600;
            border-radius: 4px;
            color: #ffffff;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            resize: none;
            white-space: nowrap;
            overflow: hidden;
            outline: none;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .url-textarea:focus {
            border-color: #ff8833;
            box-shadow: 0 0 10px rgba(255, 136, 51, 0.5);
        }

        .launch-btn {
            background: #ff6600;
            border: none;
            color: #000000;
            font-weight: bold;
            padding: 0 24px;
            height: 42px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.4);
            white-space: nowrap;
        }

        .launch-btn:hover {
            background: #ff8833;
            box-shadow: 0 0 15px rgba(255, 136, 51, 0.7);
        }

        .launch-btn:active {
            transform: scale(0.98);
        }

        /* Proxy selector pills */
        .proxy-row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .proxy-label {
            font-size: 0.72rem;
            color: #aa6633;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 4px;
        }

        .proxy-pill {
            background: #140b02;
            border: 1px solid #663300;
            color: #cc7733;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .proxy-pill:hover {
            border-color: #ff6600;
            color: #ff8833;
        }

        .proxy-pill.active {
            background: rgba(255, 102, 0, 0.15);
            border-color: #ff6600;
            color: #ff6600;
            box-shadow: 0 0 6px rgba(255, 102, 0, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>Apollo Hub // Proxy Sandbox</h1>
        <div class="status-badge">Bypass Enabled</div>
    </header>

    <div class="workspace">
        <div class="iframe-container">
            <div class="loading-overlay" id="loading-overlay">
                <div class="spinner"></div>
                <span>Routing through proxy...</span>
            </div>
            <iframe
                id="sandbox-frame"
                sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-downloads"
                src="about:blank">
            </iframe>
        </div>

        <div id="error-bar" class="error-bar"></div>

        <div class="control-bar">
            <div class="control-row">
                <textarea
                    id="url-input"
                    class="url-textarea"
                    placeholder="Enter URL (e.g., example.com)..."
                    rows="1"></textarea>
                <button id="load-btn" class="launch-btn">Execute</button>
            </div>
            <div class="proxy-row">
                <span class="proxy-label">Proxy:</span>
                <div class="proxy-pill active" data-proxy="corsproxy">CORSProxy.io</div>
                <div class="proxy-pill" data-proxy="allorigins">AllOrigins</div>
                <div class="proxy-pill" data-proxy="htmlpreview">HTMLPreview</div>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('url-input');
        const loadBtn = document.getElementById('load-btn');
        const sandboxFrame = document.getElementById('sandbox-frame');
        const loadingOverlay = document.getElementById('loading-overlay');
        const errorBar = document.getElementById('error-bar');

        // Available proxy gateways
        const PROXIES = {
            corsproxy:   url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            allorigins:  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            htmlpreview: url => `https://htmlpreview.github.io/?${encodeURIComponent(url)}`
        };

        let activeProxy = 'corsproxy';

        // Proxy pill selection
        document.querySelectorAll('.proxy-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                document.querySelectorAll('.proxy-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                activeProxy = pill.dataset.proxy;
            });
        });

        function showError(msg) {
            errorBar.textContent = msg;
            errorBar.classList.add('active');
        }

        function clearError() {
            errorBar.classList.remove('active');
            errorBar.textContent = '';
        }

        // Rewrites relative URLs in fetched HTML to absolute so assets load correctly
        function rewriteUrls(html, baseUrl) {
            const base = new URL(baseUrl);
            const origin = base.origin;
            const basePath = base.href.substring(0, base.href.lastIndexOf('/') + 1);

            // Inject a <base> tag so the browser resolves remaining relative URLs
            const baseTag = `<base href="${origin}/">`;
            if (/<head[\s>]/i.test(html)) {
                html = html.replace(/(<head[\s>][^>]*>)/i, `$1${baseTag}`);
            } else if (/<html[\s>]/i.test(html)) {
                html = html.replace(/(<html[\s>][^>]*>)/i, `$1<head>${baseTag}</head>`);
            } else {
                html = baseTag + html;
            }

            return html;
        }

        async function navigateFrame() {
            let targetUrl = urlInput.value.trim();
            if (!targetUrl) return;

            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }
            urlInput.value = targetUrl;
            clearError();

            // Revoke any previous blob URL to free memory
            const prevSrc = sandboxFrame.src;
            if (prevSrc && prevSrc.startsWith('blob:')) {
                URL.revokeObjectURL(prevSrc);
            }

            loadingOverlay.classList.add('active');
            sandboxFrame.src = 'about:blank';

            try {
                const proxyUrl = PROXIES[activeProxy](targetUrl);
                const res = await fetch(proxyUrl);

                if (!res.ok) {
                    throw new Error(`Proxy returned HTTP ${res.status}`);
                }

                const html = await res.text();

                if (!html || html.trim().length === 0) {
                    throw new Error('Proxy returned empty response. Try a different proxy.');
                }

                // Rewrite relative URLs → absolute so assets load
                const rewritten = rewriteUrls(html, targetUrl);

                // Render via blob URL — avoids X-Frame-Options / CSP blocking
                const blob = new Blob([rewritten], { type: 'text/html; charset=utf-8' });
                const blobUrl = URL.createObjectURL(blob);
                sandboxFrame.src = blobUrl;

            } catch (err) {
                sandboxFrame.src = 'about:blank';
                showError(`⚠ Failed: ${err.message}`);
            } finally {
                loadingOverlay.classList.remove('active');
            }
        }

        loadBtn.addEventListener('click', navigateFrame);
        urlInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                navigateFrame();
            }
        });
    </script>
</body>
</html>
