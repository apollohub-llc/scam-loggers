<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates Hub</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border: #e5e7eb;
            --primary: #111827;
            --primary-hover: #1f2937;
            --secondary: #f3f4f6;
            --secondary-hover: #e5e7eb;
            --radius: 12px;
        }

        /* Automatic Dark Mode Override based on system settings */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #0b0f19;
                --bg-card: #111827;
                --text-main: #f9fafb;
                --text-muted: #9ca3af;
                --border: #1f2937;
                --primary: #f9fafb;
                --primary-hover: #e5e7eb;
                --secondary: #1f2937;
                --secondary-hover: #374151;
            }
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            padding: 3rem 2rem; 
            transition: background 0.2s, color 0.2s;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        header {
            margin-bottom: 3rem;
        }

        h1 { 
            font-size: 2.25rem; 
            font-weight: 700; 
            letter-spacing: -0.025em;
        }
        
        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        
        /* Clean Responsive Grid */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 2rem; 
        }
        
        /* Minimalist Card Design */
        .template-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            padding: 1.25rem; 
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .template-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.15);
        }
        
        .template-img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            border-radius: calc(var(--radius) - 4px); 
            background: var(--secondary);
            border: 1px solid var(--border);
        }
        
        .template-title { 
            font-size: 1.125rem; 
            font-weight: 600; 
            color: var(--text-main); 
        }
        
        .btn-group { 
            display: flex; 
            gap: 0.75rem; 
            margin-top: auto; 
        }
        
        button, a.btn { 
            flex: 1;
            padding: 0.75rem; 
            border: none; 
            border-radius: 8px; 
            font-size: 0.875rem; 
            font-weight: 500; 
            text-align: center;
            text-decoration: none;
            cursor: pointer; 
            transition: background 0.15s, transform 0.1s; 
        }

        button:active, a.btn:active { 
            transform: scale(0.98); 
        }
        
        .btn-primary { 
            background: var(--primary); 
            color: var(--bg-main); 
        }

        .btn-primary:hover { 
            background: var(--primary-hover); 
        }
        
        .btn-secondary { 
            background: var(--secondary); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
        }

        .btn-secondary:hover { 
            background: var(--secondary-hover); 
        }
        
        #loading { 
            font-size: 1.1rem; 
            color: var(--text-muted); 
            text-align: center; 
            margin-top: 4rem; 
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Templates Hub</h1>
            <p class="subtitle">Browse and deploy standard layout structures.</p>
        </header>

        <div id="loading">Loading configurations...</div>
        <div class="grid" id="templates-grid"></div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Keep this clean, replace string value dynamically when deploying
        const firebaseConfig = {
            apiKey: "YOUR_SECURE_API_KEY",
            authDomain: "website-templates-60c6d.firebaseapp.com",
            projectId: "website-templates-60c6d",
            storageBucket: "website-templates-60c6d.firebasestorage.app",
            messagingSenderId: "799034936266",
            appId: "1:799034936266:web:d0954b442aafd895a5dd33",
            measurementId: "G-BKK5Y8F4HT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchTemplates() {
            const grid = document.getElementById('templates-grid');
            const loading = document.getElementById('loading');
            
            try {
                const querySnapshot = await getDocs(collection(db, "templates"));
                loading.style.display = 'none';
                
                if(querySnapshot.empty) {
                    grid.innerHTML = "<p style='color: var(--text-muted); text-align: center; grid-column: 1/-1;'>No records located.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    const card = document.createElement('div');
                    card.className = 'template-card';
                    
                    card.innerHTML = `
                        <img src="${data.image || 'https://via.placeholder.com/300x200'}" alt="${data.title || 'Layout Template'}" class="template-img">
                        <div class="template-title">${data.title || 'Untitled Document'}</div>
                        <div class="btn-group">
                            <a href="${data.viewLink || '#'}" target="_blank" class="btn btn-primary">View Template</a>
                            <button class="btn btn-secondary" id="copy-${doc.id}">Copy Source</button>
                        </div>
                    `;
                    grid.appendChild(card);

                    // Added distinct dynamic click attachment loop cleanly 
                    document.getElementById(`copy-${doc.id}`).addEventListener('click', () => {
                        navigator.clipboard.writeText(data.sourceCode || '');
                        alert('Source code copied to clipboard!');
                    });
                });
            } catch (error) {
                console.error("Fetch process terminated:", error);
                loading.innerText = "Failed to load database elements.";
            }
        }

        fetchTemplates();
    </script>
</body>
</html>
