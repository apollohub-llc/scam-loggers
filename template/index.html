<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates Hub</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border: #e5e7eb;
            --primary: #111827;
            --primary-hover: #1f2937;
            --secondary: #f3f4f6;
            --secondary-hover: #e5e7eb;
            --radius: 12px;
        }

        /* Automatic Dark Mode Override */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #0b0f19;
                --bg-card: #111827;
                --text-main: #f9fafb;
                --text-muted: #9ca3af;
                --border: #1f2937;
                --primary: #f9fafb;
                --primary-hover: #e5e7eb;
                --secondary: #1f2937;
                --secondary-hover: #374151;
            }
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            padding: 3rem 2rem; 
            transition: background 0.2s, color 0.2s;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        header {
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-end;
            }
        }

        .header-text h1 { 
            font-size: 2.25rem; 
            font-weight: 700; 
            letter-spacing: -0.025em;
        }
        
        .header-text .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Real-time Search Input Component */
        .search-container {
            position: relative;
            width: 100%;
            max-width: 360px;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .search-input:focus {
            border-color: var(--text-muted);
            box-shadow: 0 0 0 3px rgba(156, 163, 175, 0.15);
        }
        
        /* Clean Responsive Grid */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 2rem; 
        }
        
        /* Minimalist Card Design */
        .template-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            padding: 1.25rem; 
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .template-card.hidden {
            display: none !important;
        }

        .template-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.15);
        }
        
        .template-img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            border-radius: calc(var(--radius) - 4px); 
            background: var(--secondary);
            border: 1px solid var(--border);
        }
        
        .template-title { 
            font-size: 1.125rem; 
            font-weight: 600; 
            color: var(--text-main); 
        }
        
        .btn-group { 
            display: flex; 
            gap: 0.75rem; 
            margin-top: auto; 
        }
        
        button, a.btn { 
            flex: 1;
            padding: 0.75rem; 
            border: none; 
            border-radius: 8px; 
            font-size: 0.875rem; 
            font-weight: 500; 
            text-align: center;
            text-decoration: none;
            cursor: pointer; 
            transition: background 0.15s, transform 0.1s; 
        }

        button:active, a.btn:active { 
            transform: scale(0.98); 
        }
        
        .btn-primary { 
            background: var(--primary); 
            color: var(--bg-main); 
        }

        .btn-primary:hover { 
            background: var(--primary-hover); 
        }
        
        .btn-secondary { 
            background: var(--secondary); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
        }

        .btn-secondary:hover { 
            background: var(--secondary-hover); 
        }
        
        #loading, #no-results { 
            font-size: 1.1rem; 
            color: var(--text-muted); 
            text-align: center; 
            margin-top: 4rem; 
            grid-column: 1 / -1;
        }

        #no-results {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-text">
                <h1>Templates Hub</h1>
                <p class="subtitle">Browse and deploy standard layout structures.</p>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search templates..." autocomplete="off">
            </div>
        </header>

        <div class="grid" id="templates-grid">
            <div id="loading">Loading configurations...</div>
            <div id="no-results">No templates match your search.</div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_SECURE_API_KEY",
            authDomain: "website-templates-60c6d.firebaseapp.com",
            projectId: "website-templates-60c6d",
            storageBucket: "website-templates-60c6d.firebasestorage.app",
            messagingSenderId: "799034936266",
            appId: "1:799034936266:web:d0954b442aafd895a5dd33",
            measurementId: "G-BKK5Y8F4HT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Store active templates globally for local quick-filtering
        let templateElements = [];

        async function fetchTemplates() {
            const grid = document.getElementById('templates-grid');
            const loading = document.getElementById('loading');
            
            try {
                const querySnapshot = await getDocs(collection(db, "templates"));
                loading.style.display = 'none';
                
                if(querySnapshot.empty) {
                    grid.innerHTML = "<p style='color: var(--text-muted); text-align: center; grid-column: 1/-1;'>No records located.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const titleText = data.title || 'Untitled Document';
                    
                    const card = document.createElement('div');
                    card.className = 'template-card';
                    
                    card.innerHTML = `
                        <img src="${data.image || 'https://via.placeholder.com/300x200'}" alt="${titleText}" class="template-img">
                        <div class="template-title">${titleText}</div>
                        <div class="btn-group">
                            <a href="${data.viewLink || '#'}" target="_blank" class="btn btn-primary">View Template</a>
                            <button class="btn btn-secondary" id="copy-${doc.id}">Copy Source</button>
                        </div>
                    `;
                    grid.appendChild(card);

                    // Track the DOM element along with its filter key (lowercased title)
                    templateElements.push({
                        element: card,
                        title: titleText.toLowerCase()
                    });

                    document.getElementById(`copy-${doc.id}`).addEventListener('click', () => {
                        navigator.clipboard.writeText(data.sourceCode || '');
                        alert('Source code copied to clipboard!');
                    });
                });

                // Initialize local input query system monitoring
                initSearchFilter();

            } catch (error) {
                console.error("Fetch process terminated:", error);
                loading.innerText = "Failed to load database elements.";
            }
        }

        function initSearchFilter() {
            const searchInput = document.getElementById('searchInput');
            const noResults = document.getElementById('no-results');

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                let matchingCount = 0;

                templateElements.forEach(item => {
                    if (item.title.includes(query)) {
                        item.element.classList.remove('hidden');
                        matchingCount++;
                    } else {
                        item.element.classList.add('hidden');
                    }
                });

                // Display fallback notification if no templates pass structural match conditions
                if (matchingCount === 0 && query !== '') {
                    noResults.style.display = 'block';
                } else {
                    noResults.style.display = 'none';
                }
            });
        }

        fetchTemplates();
    </script>
</body>
</html>
