<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Hub // Report System</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --panel-color: #12161f;
            --border-color: #1f2937;
            --neon-green: #00ff66;
            --neon-green-glow: rgba(0, 255, 102, 0.2);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-color);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green-glow);
            padding: 30px;
            border-radius: 8px;
        }

        h1, h2 {
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--neon-green);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--neon-green);
            font-size: 0.9rem;
            font-weight: bold;
        }

        input[type="text"], textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 4px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green-glow);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Checkbox Styling */
        .checklist-group {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            color: var(--text-main);
            user-select: none;
        }

        .checkbox-label input {
            display: none;
        }

        .custom-box {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-color);
            margin-right: 12px;
            display: inline-block;
            position: relative;
            background: transparent;
        }

        .checkbox-label input:checked + .custom-box {
            border-color: var(--neon-green);
            background: var(--neon-green);
        }

        .checkbox-label input:checked + .custom-box::after {
            content: '✓';
            position: absolute;
            color: #000;
            font-weight: bold;
            font-size: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Socials Row Layout */
        .social-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 12px 24px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-small {
            padding: 12px;
        }

        .btn-submit {
            width: 100%;
            margin-top: 20px;
            font-size: 1.1rem;
            background: rgba(0, 255, 102, 0.1);
        }

        /* Report Output Display Elements */
        .report-header {
            display: flex;
            gap: 25px;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .report-pfp {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 2px solid var(--neon-green);
            border-radius: 6px;
            box-shadow: 0 0 10px var(--neon-green-glow);
            background: #000;
        }

        .report-meta-box {
            flex-grow: 1;
        }

        .meta-line {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .meta-label {
            color: var(--neon-green);
            font-weight: bold;
        }

        .report-section {
            margin-top: 30px;
        }

        .report-section h3 {
            color: var(--neon-green);
            margin-bottom: 12px;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .flag-item-active {
            color: #ff3333;
            margin-bottom: 8px;
            list-style: none;
        }
        .flag-item-active::before {
            content: "[✖] ";
            font-weight: bold;
        }

        .socials-container-display {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .link-btn {
            display: inline-block;
            text-decoration: none;
            background: #111827;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .link-btn:hover {
            background: var(--neon-green);
            color: #000;
        }

        .description-output {
            white-space: pre-wrap;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-left: 3px solid var(--neon-green);
            color: var(--text-main);
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- FORM INTERFACE -->
    <div id="form-view">
        <h1>Evidence Hub // Create Log</h1>
        <form id="reportForm">
            <div class="form-group">
                <label>Profile Picture URL</label>
                <input type="text" id="pfp" placeholder="e.g., https://i.imgur.com/t0eXGct.jpeg">
            </div>

            <div class="form-group">
                <label>Target Name / Alias</label>
                <input type="text" id="targetName" required placeholder="e.g., John Doe">
            </div>

            <div class="form-group">
                <label>Role Claimed</label>
                <input type="text" id="roleClaimed" placeholder="e.g., Web Dev Scammer">
            </div>

            <div class="form-group">
                <label>Other Info</label>
                <input type="text" id="otherInfo" placeholder="e.g., Operating via Discord servers">
            </div>

            <div class="form-group">
                <label>Red Flags Checklist</label>
                <div class="checklist-group">
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="No live portfolio link"><span class="custom-box"></span>No live portfolio link</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="Refused to show work (&quot;client privacy&quot;)"><span class="custom-box"></span>Refused to show work ("client privacy")</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="Sent screenshots instead of live links"><span class="custom-box"></span>Sent screenshots instead of live links</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="Fake or suspicious reviews"><span class="custom-box"></span>Fake or suspicious reviews</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="WhatsApp/Telegram as only contact"><span class="custom-box"></span>WhatsApp/Telegram as only contact</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="Demanded payment upfront"><span class="custom-box"></span>Demanded payment upfront</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="Poor grammar / copy-paste scripts"><span class="custom-box"></span>Poor grammar / copy-paste scripts</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="Domain registered recently (&lt;30 days)"><span class="custom-box"></span>Domain registered recently (&lt;30 days)</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="Budget hosting (Hostinger, Namecheap, etc.)"><span class="custom-box"></span>Budget hosting (Hostinger, Namecheap, etc.)</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="Template-based &quot;portfolio&quot; sites"><span class="custom-box"></span>Template-based "portfolio" sites</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="AI-generated images"><span class="custom-box"></span>AI-generated images</label>
                    <label class="checkbox-label"><input type="checkbox" name="flags" value="Mismatched name/location"><span class="custom-box"></span>Mismatched name/location</label>
                    
                    <div style="margin-top: 15px; display: flex; gap: 10px;" id="customFlagInputGroup">
                        <input type="text" id="otherFlag" placeholder="Other custom flag..." style="flex-grow: 1;">
                        <button type="button" class="btn btn-small" id="addFlagBtn">+</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Socials</label>
                <div id="socialsContainer">
                    <div class="social-input-group">
                        <input type="text" name="socialPlatform" placeholder="Platform (e.g., Discord)" style="width: 40%;">
                        <input type="text" name="socialLink" placeholder="Profile Link/Handle" style="width: 60%;">
                    </div>
                </div>
                <button type="button" class="btn btn-small" id="addSocialBtn" style="margin-top: 5px;">+ Add Social</button>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="description" placeholder="Provide raw details, incident records, timeline..."></textarea>
            </div>

            <div class="form-group">
                <label>Chatlogs Link</label>
                <input type="text" id="chatlogs" placeholder="e.g., https://discord.com/channels/... or pastebin link">
            </div>

            <button type="submit" class="btn btn-submit">Generate Report</button>
        </form>
    </div>

    <!-- REPORT GENERATED VIEW -->
    <div id="report-view" class="hidden">
        <h1>Evidence Hub // Threat Case Report</h1>
        
        <div class="report-header">
            <img id="outPfp" src="" class="report-pfp" alt="No Avatar Provided">
            <div class="report-meta-box">
                <div class="meta-line"><span class="meta-label">TARGET:</span> <span id="outName"></span></div>
                <div class="meta-line"><span class="meta-label">ROLE DETECTED:</span> <span id="outRole"></span></div>
                <div class="meta-line"><span class="meta-label">ADDITIONAL INFO:</span> <span id="outOther"></span></div>
            </div>
        </div>

        <div class="report-section" id="flagsSection">
            <h3>Identified Red Flags</h3>
            <ul id="outFlags"></ul>
        </div>

        <div class="report-section" id="socialsSection">
            <h3>Associated Handles / Socials</h3>
            <div class="socials-container-display" id="outSocials"></div>
        </div>

        <div class="report-section">
            <h3>Incident Data / Case Description</h3>
            <div class="description-output" id="outDesc"></div>
        </div>

        <div class="report-section" id="chatlogsSection">
            <h3>Chat Logs & Core Proof</h3>
            <a id="outChatlogs" href="#" target="_blank" class="link-btn">See Chatlogs</a>
        </div>
    </div>
</div>

<script>
    const socialsContainer = document.getElementById('socialsContainer');
    const addSocialBtn = document.getElementById('addSocialBtn');
    const addFlagBtn = document.getElementById('addFlagBtn');
    const otherFlagInput = document.getElementById('otherFlag');
    const customFlagInputGroup = document.getElementById('customFlagInputGroup');
    const reportForm = document.getElementById('reportForm');
    const formView = document.getElementById('form-view');
    const reportView = document.getElementById('report-view');

    // Handle adding dynamic custom checkboxes to checklist
    addFlagBtn.addEventListener('click', () => {
        const flagValue = otherFlagInput.value.trim();
        if (flagValue !== "") {
            const label = document.createElement('label');
            label.className = 'checkbox-label';
            label.innerHTML = `
                <input type="checkbox" name="flags" value="${flagValue}" checked>
                <span class="custom-box"></span>
                ${flagValue}
            `;
            // Insert new checkbox directly above the input group
            customFlagInputGroup.parentNode.insertBefore(label, customFlagInputGroup);
            otherFlagInput.value = "";
        }
    });

    // Handle adding dynamic multiple social inputs
    addSocialBtn.addEventListener('click', () => {
        const div = document.createElement('div');
        div.className = 'social-input-group';
        div.innerHTML = `
            <input type="text" name="socialPlatform" placeholder="Platform (e.g., Telegram)" style="width: 40%;">
            <input type="text" name="socialLink" placeholder="Profile Link/Handle" style="width: 60%;">
        `;
        socialsContainer.appendChild(div);
    });

    // Form submission processing
    reportForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const pfp = document.getElementById('pfp').value;
        const targetName = document.getElementById('targetName').value;
        const roleClaimed = document.getElementById('roleClaimed').value;
        const otherInfo = document.getElementById('otherInfo').value;
        const description = document.getElementById('description').value;
        const chatlogs = document.getElementById('chatlogs').value;

        // Gather all checked flags (includes custom checkboxes created via the button)
        let checkedFlags = [];
        document.querySelectorAll('input[name="flags"]:checked').forEach(cb => {
            checkedFlags.push(cb.value);
        });
        
        // Check if there is leftover text in the input box that hasn't been added yet
        const remainingFlag = otherFlagInput.value.trim();
        if(remainingFlag && !checkedFlags.includes(remainingFlag)) {
            checkedFlags.push(remainingFlag);
        }

        // Gather all socials
        let socialsData = [];
        const platforms = document.getElementsByName('socialPlatform');
        const links = document.getElementsByName('socialLink');
        for(let i=0; i < platforms.length; i++) {
            if(platforms[i].value.trim() !== "" || links[i].value.trim() !== "") {
                socialsData.push({
                    platform: platforms[i].value.trim() || 'Link',
                    url: links[i].value.trim()
                });
            }
        }

        const payload = {
            pfp,
            targetName,
            roleClaimed,
            otherInfo,
            description,
            chatlogs,
            flags: checkedFlags,
            socials: socialsData
        };

        const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        window.location.href = window.location.origin + window.location.pathname + '?report=' + encodedData;
    });

    // Parse URL parameters configuration structure
    function loadReportFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        const reportDataRaw = urlParams.get('report');

        if (reportDataRaw) {
            try {
                const data = JSON.parse(decodeURIComponent(escape(atob(reportDataRaw))));

                formView.style.display = 'none';
                reportView.classList.remove('hidden');

                const pfpImg = document.getElementById('outPfp');
                if (data.pfp && data.pfp.trim() !== "") {
                    pfpImg.src = data.pfp;
                } else {
                    pfpImg.style.display = 'none';
                }

                document.getElementById('outName').textContent = data.targetName || "UNKNOWN RECORD";
                document.getElementById('outRole').textContent = data.roleClaimed || "None Documented";
                document.getElementById('outOther').textContent = data.otherInfo || "N/A";
                document.getElementById('outDesc').textContent = data.description || "No specific detailed description logged.";

                const flagsList = document.getElementById('outFlags');
                if (data.flags && data.flags.length > 0) {
                    data.flags.forEach(flag => {
                        const li = document.createElement('li');
                        li.className = 'flag-item-active';
                        li.textContent = flag;
                        flagsList.appendChild(li);
                    });
                } else {
                    document.getElementById('flagsSection').style.display = 'none';
                }

                const socialsDiv = document.getElementById('outSocials');
                if (data.socials && data.socials.length > 0) {
                    data.socials.forEach(soc => {
                        const a = document.createElement('a');
                        a.className = 'link-btn';
                        a.textContent = soc.platform;
                        a.href = soc.url.startsWith('http') ? soc.url : 'https://' + soc.url;
                        a.target = '_blank';
                        socialsDiv.appendChild(a);
                    });
                } else {
                    document.getElementById('socialsSection').style.display = 'none';
                }

                const chatlogsBtn = document.getElementById('outChatlogs');
                if (data.chatlogs && data.chatlogs.trim() !== "") {
                    chatlogsBtn.href = data.chatlogs.startsWith('http') ? data.chatlogs : 'https://' + data.chatlogs;
                } else {
                    document.getElementById('chatlogsSection').style.display = 'none';
                }

                window.history.replaceState(null, null, window.location.href);

            } catch (error) {
                console.error("Failed processing payload: ", error);
                alert("Data error loading system configuration file parameters.");
            }
        }
    }

    window.onload = loadReportFromURL;
</script>
</body>
</html>
