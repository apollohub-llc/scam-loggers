<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Hub | Chatlogs</title>
    <style>
        :root {
            --primary-orange: #ff6600;
            --dark-bg: #0a0a0a;
            --surface-bg: #1a1a1a;
            --text-color: #ffffff;
            --neon-glow: 0 0 10px rgba(255, 102, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- UI Controls --- */
        .controls {
            position: fixed;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .btn {
            background: var(--surface-bg);
            border: 1px solid var(--primary-orange);
            color: var(--primary-orange);
            padding: 10px 15px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 12px;
            transition: 0.3s;
            box-shadow: var(--neon-glow);
        }

        .btn:hover {
            background: var(--primary-orange);
            color: black;
            box-shadow: 0 0 20px var(--primary-orange);
        }

        /* --- Chat Interface --- */
        #chat-container {
            flex: 1;
            margin-top: 80px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 90%;
            align-self: center;
        }

        .message {
            background: var(--surface-bg);
            padding: 12px 18px;
            border-left: 3px solid var(--primary-orange);
            border-radius: 4px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .input-area {
            padding: 20px;
            background: #111;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }

        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--primary-orange); }

        /* --- Manage Modal --- */
        #manage-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface-bg);
            border: 2px solid var(--primary-orange);
            width: 350px;
            padding: 20px;
            z-index: 200;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .modal-header { margin-bottom: 15px; border-bottom: 1px solid var(--primary-orange); padding-bottom: 5px; }
        
        .save-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .save-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            background: #222;
            font-size: 13px;
            align-items: center;
        }

        .save-actions button {
            background: transparent;
            border: none;
            color: var(--primary-orange);
            margin-left: 10px;
            cursor: pointer;
            font-size: 11px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 150;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn" onclick="toggleModal()">Manage Chats</button>
        <button class="btn" onclick="exportChat()">Export Chat</button>
        <button class="btn" style="border-color: #ff3333; color: #ff3333;" onclick="clearCurrentChat()">Delete Chat</button>
    </div>

    <div id="chat-container"></div>

    <div class="input-area">
        <input type="text" id="chat-input" placeholder="Enter message..." onkeypress="handleKey(event)">
        <button class="btn" onclick="sendMessage()">Send</button>
    </div>

    <!-- Management Tab -->
    <div class="overlay" id="overlay" onclick="toggleModal()"></div>
    <div id="manage-modal">
        <div class="modal-header">SAVE MANAGER</div>
        <input type="text" id="save-name" placeholder="Save Name..." style="width: 100%; margin-bottom: 10px; background: #000; border: 1px solid #444; color: white; padding: 5px;">
        <button class="btn" style="width: 100%;" onclick="saveChat()">Save / Overwrite</button>
        
        <div class="save-list" id="save-list">
            <!-- Saves will appear here -->
        </div>
        
        <button class="btn" style="width: 100%; margin-top: 10px; border-color: #777; color: #777;" onclick="toggleModal()">Close</button>
    </div>

    <script>
        let currentMessages = JSON.parse(localStorage.getItem('apollo_current_chat')) || [];
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');

        // Initialize
        renderMessages();

        function renderMessages() {
            chatContainer.innerHTML = '';
            currentMessages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message';
                div.textContent = msg;
                chatContainer.appendChild(div);
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
            localStorage.setItem('apollo_current_chat', JSON.stringify(currentMessages));
        }

        function sendMessage() {
            const val = chatInput.value.trim();
            if (val) {
                currentMessages.push(val);
                chatInput.value = '';
                renderMessages();
            }
        }

        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

        function clearCurrentChat() {
            if (confirm("Delete current chat? This will wipe the active session.")) {
                currentMessages = [];
                renderMessages();
            }
        }

        function exportChat() {
            if (currentMessages.length === 0) return alert("Nothing to export!");
            const text = "Saved chat:\n" + currentMessages.join('\n\n');
            navigator.clipboard.writeText(text).then(() => {
                alert("Chat copied to clipboard!");
            });
        }

        // --- Save System ---
        function toggleModal() {
            const modal = document.getElementById('manage-modal');
            const overlay = document.getElementById('overlay');
            const isOpen = modal.style.display === 'block';
            modal.style.display = isOpen ? 'none' : 'block';
            overlay.style.display = isOpen ? 'none' : 'block';
            if (!isOpen) updateSaveList();
        }

        function saveChat() {
            const name = document.getElementById('save-name').value.trim();
            if (!name) return alert("Enter a save name");
            
            let saves = JSON.parse(localStorage.getItem('apollo_saves')) || {};
            saves[name] = [...currentMessages];
            localStorage.setItem('apollo_saves', JSON.stringify(saves));
            
            document.getElementById('save-name').value = '';
            updateSaveList();
            alert("Chat saved as: " + name);
        }

        function updateSaveList() {
            const list = document.getElementById('save-list');
            const saves = JSON.parse(localStorage.getItem('apollo_saves')) || {};
            list.innerHTML = '';
            
            Object.keys(saves).forEach(name => {
                const item = document.createElement('div');
                item.className = 'save-item';
                item.innerHTML = `
                    <span>${name}</span>
                    <div class="save-actions">
                        <button onclick="loadSave('${name}')">LOAD</button>
                        <button style="color: #ff3333;" onclick="deleteSave('${name}')">DEL</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function loadSave(name) {
            const saves = JSON.parse(localStorage.getItem('apollo_saves'));
            currentMessages = saves[name];
            renderMessages();
            toggleModal();
        }

        function deleteSave(name) {
            if (confirm(`Delete save "${name}"?`)) {
                let saves = JSON.parse(localStorage.getItem('apollo_saves'));
                delete saves[name];
                localStorage.setItem('apollo_saves', JSON.stringify(saves));
                updateSaveList();
            }
        }
    </script>
</body>
</html>
