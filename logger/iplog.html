<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Live Admin Panel | Auto-Refreshing Logs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c15;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            padding: 1.5rem;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: #11141f;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #2a2f42;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        h1 {
            color: #e2e8f0;
            font-size: 1.8rem;
        }
        .badge {
            background: #1e2a4a;
            color: #60a5fa;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.8rem;
        }
        .live-badge {
            background: #14532d;
            color: #86efac;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .stats {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #0f172a;
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            border: 1px solid #2d3748;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #60a5fa;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #8b9ab0;
        }
        .controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        button {
            background: #1e2a4a;
            border: none;
            border-radius: 2rem;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
            cursor: pointer;
            transition: 0.1s;
        }
        button:hover {
            transform: scale(0.97);
        }
        .btn-danger {
            background: #7f1d1d;
        }
        .btn-danger:hover {
            background: #991b1b;
        }
        .btn-success {
            background: #14532d;
        }
        .btn-warning {
            background: #92400e;
        }
        .filters {
            background: #11141f;
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #2a2f42;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters select, .filters input {
            background: #0c0f18;
            border: 1px solid #2a2f42;
            border-radius: 0.8rem;
            padding: 0.5rem 1rem;
            color: #f1f5f9;
            font-size: 0.8rem;
        }
        .logs-table-wrapper {
            background: #11141f;
            border-radius: 1.5rem;
            border: 1px solid #2a2f42;
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8rem 1rem;
            text-align: left;
            border-bottom: 1px solid #2a2f42;
            font-size: 0.8rem;
        }
        th {
            background: #0f172a;
            color: #cbd5e6;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            color: #e2e8f0;
        }
        tr:hover {
            background: #1a1f2e;
        }
        .loading {
            text-align: center;
            padding: 3rem;
            color: #8b9ab0;
        }
        .checkbox-col {
            width: 40px;
        }
        .batch-controls {
            padding: 0.8rem 1rem;
            background: #0f172a;
            border-radius: 0.8rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #11141f;
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 400px;
            text-align: center;
            border: 1px solid #2a2f42;
        }
        .modal-content h3 {
            color: #e2e8f0;
            margin-bottom: 1rem;
        }
        .modal-content p {
            color: #8b9ab0;
            margin-bottom: 1.5rem;
        }
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        code {
            background: #0c0f18;
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.7rem;
        }
        .new-row {
            animation: highlight 1s ease-out;
        }
        @keyframes highlight {
            0% { background-color: #2d4a6e; }
            100% { background-color: transparent; }
        }
        .auto-refresh-status {
            font-size: 0.7rem;
            color: #86efac;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>📊 Live Admin Panel</h1>
            <div class="badge live-badge">🔴 LIVE AUTO-REFRESH</div>
        </div>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Logs</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="newCount">0</div>
                <div class="stat-label">New (last refresh)</div>
            </div>
        </div>
    </div>

    <div class="filters">
        <select id="collectionSelect">
            <option value="visitor_analytics">📊 visitor_analytics (Analytics Injector)</option>
            <option value="visitor_logs">📝 visitor_logs (Link Logger)</option>
            <option value="global_link_mappings">🔗 global_link_mappings (Global Links)</option>
        </select>
        <input type="text" id="searchInput" placeholder="🔍 Search IP / Location / City...">
        <div class="controls">
            <button id="refreshBtn" class="btn-success">🔄 Refresh Now</button>
            <button id="toggleAutoBtn" class="btn-warning">⏸️ Pause Auto-Refresh</button>
            <button id="clearAllBtn" class="btn-danger">🗑️ Clear ALL from this collection</button>
        </div>
    </div>

    <div class="batch-controls" id="batchControls" style="display: none;">
        <input type="checkbox" id="selectAllCheckbox"> <label style="color:#e2e8f0;">Select All on Page</label>
        <button id="deleteSelectedBtn" class="btn-danger">🗑️ Delete Selected (<span id="selectedCount">0</span>)</button>
    </div>

    <div class="logs-table-wrapper">
        <table>
            <thead>
                <tr>
                    <th class="checkbox-col"><input type="checkbox" id="headerSelectCheckbox" style="display:none;"></th>
                    <th>Timestamp</th>
                    <th>Location/Alias</th>
                    <th>IP Address</th>
                    <th>City/Country</th>
                    <th>Device</th>
                    <th>Destination/URL</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
                <tr><td colspan="7" class="loading">Loading logs...<td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="confirmModal" class="modal">
    <div class="modal-content">
        <h3>⚠️ Confirm Delete</h3>
        <p id="modalMessage"></p>
        <div class="modal-buttons">
            <button id="confirmYes" class="btn-danger">Yes, Delete</button>
            <button id="confirmNo">Cancel</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy, limit, startAfter } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDp8UzNz8BqjDfbVd_xUdXL_4KqXWi3VrI",
        authDomain: "website-templates-60c6d.firebaseapp.com",
        projectId: "website-templates-60c6d",
        storageBucket: "website-templates-60c6d.firebasestorage.app",
        messagingSenderId: "799034936266",
        appId: "1:799034936266:web:d0954b442aafd895a5dd33"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let currentCollection = "visitor_analytics";
    let allLogs = [];
    let filteredLogs = [];
    let selectedLogs = new Set();
    let currentLogIds = new Set();
    let autoRefreshInterval = null;
    let isAutoRefreshing = true;
    let lastLogCount = 0;
    let newLogCount = 0;
    
    const collectionSelect = document.getElementById('collectionSelect');
    const searchInput = document.getElementById('searchInput');
    const refreshBtn = document.getElementById('refreshBtn');
    const toggleAutoBtn = document.getElementById('toggleAutoBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const logsTableBody = document.getElementById('logsTableBody');
    const totalCountSpan = document.getElementById('totalCount');
    const newCountSpan = document.getElementById('newCount');

    async function loadLogs(isAutoRefresh = false) {
        try {
            const q = query(collection(db, currentCollection), orderBy("timestamp", "desc"));
            const querySnapshot = await getDocs(q);
            
            const newLogs = [];
            querySnapshot.forEach((doc) => {
                newLogs.push({ id: doc.id, ...doc.data() });
            });
            
            const oldLogIds = new Set(allLogs.map(l => l.id));
            const actuallyNewLogs = newLogs.filter(l => !oldLogIds.has(l.id));
            newLogCount = actuallyNewLogs.length;
            
            if (isAutoRefresh && newLogCount > 0) {
                newCountSpan.innerText = `+${newLogCount}`;
                setTimeout(() => {
                    if (newCountSpan.innerText === `+${newLogCount}`) {
                        newCountSpan.innerText = "0";
                    }
                }, 3000);
            } else if (!isAutoRefresh) {
                newCountSpan.innerText = "0";
            }
            
            allLogs = newLogs;
            lastLogCount = allLogs.length;
            totalCountSpan.innerText = allLogs.length;
            
            applyFilters(isAutoRefresh);
            
        } catch (error) {
            console.error("Error loading logs:", error);
            if (!isAutoRefresh) {
                logsTableBody.innerHTML = '<tr><td colspan="7" class="loading">❌ Error loading collection. Make sure it exists.</td></tr>';
            }
        }
    }

    function applyFilters(isAutoRefresh = false) {
        const searchTerm = searchInput.value.toLowerCase();
        filteredLogs = allLogs.filter(log => {
            return !searchTerm || 
                (log.ip && log.ip.toLowerCase().includes(searchTerm)) ||
                (log.city && log.city.toLowerCase().includes(searchTerm)) ||
                (log.country && log.country.toLowerCase().includes(searchTerm)) ||
                (log.location && log.location.toLowerCase().includes(searchTerm)) ||
                (log.alias && log.alias.toLowerCase().includes(searchTerm));
        });
        
        renderTable(isAutoRefresh);
    }

    function renderTable(isAutoRefresh = false) {
        if (filteredLogs.length === 0) {
            logsTableBody.innerHTML = '<tr><td colspan="7" class="loading">No logs found</td></tr>';
            return;
        }
        
        const oldSelectedIds = new Set(selectedLogs);
        selectedLogs.clear();
        
        const rows = filteredLogs.map(log => {
            const timestamp = log.timestamp ? new Date(log.timestamp).toLocaleString() : 'N/A';
            const location = log.location || log.alias || '—';
            const cityCountry = `${log.city || '—'}, ${log.country || '—'}`;
            const destination = log.destination || log.pageUrl || '—';
            const device = log.deviceType || (log.userAgent?.includes('Mobile') ? 'Mobile' : 'Desktop');
            const wasSelected = oldSelectedIds.has(log.id);
            if (wasSelected) selectedLogs.add(log.id);
            
            return `
                <tr class="${isAutoRefresh ? 'new-row' : ''}">
                    <td class="checkbox-col"><input type="checkbox" class="log-checkbox" data-id="${log.id}" ${wasSelected ? 'checked' : ''}></td>
                    <td style="font-size:0.7rem;">${escapeHtml(timestamp)}</td>
                    <td><span style="background:#1e2a4a; padding:0.2rem 0.5rem; border-radius:1rem; font-size:0.7rem;">${escapeHtml(location)}</span></td>
                    <td><code>${log.ip || '—'}</code></td>
                    <td>${escapeHtml(cityCountry)}</td>
                    <td>${device}</td>
                    <td style="max-width:300px; overflow:hidden; text-overflow:ellipsis; font-size:0.75rem;">${escapeHtml(destination)}</td>
                </tr>
            `;
        }).join('');
        
        logsTableBody.innerHTML = rows;
        
        document.querySelectorAll('.log-checkbox').forEach(cb => {
            cb.addEventListener('change', (e) => {
                const id = e.target.getAttribute('data-id');
                if (e.target.checked) {
                    selectedLogs.add(id);
                } else {
                    selectedLogs.delete(id);
                }
                updateBatchControls();
            });
        });
        
        updateBatchControls();
    }

    function updateBatchControls() {
        const batchControls = document.getElementById('batchControls');
        const selectedCountSpan = document.getElementById('selectedCount');
        if (selectedLogs.size > 0) {
            batchControls.style.display = 'flex';
            selectedCountSpan.innerText = selectedLogs.size;
        } else {
            batchControls.style.display = 'none';
        }
    }

    async function deleteLogs(logIds, message) {
        return new Promise((resolve) => {
            document.getElementById('modalMessage').innerHTML = message;
            window.currentModalAction = async () => {
                document.getElementById('confirmModal').style.display = 'none';
                let deleted = 0;
                for (const id of logIds) {
                    try {
                        await deleteDoc(doc(db, currentCollection, id));
                        deleted++;
                    } catch(e) { console.error(e); }
                }
                alert(`✅ Deleted ${deleted} log(s) from "${currentCollection}"`);
                await loadLogs(false);
                resolve();
            };
            document.getElementById('confirmModal').style.display = 'flex';
        });
    }

    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(() => {
            if (isAutoRefreshing) {
                loadLogs(true);
            }
        }, 3000);
    }

    refreshBtn.addEventListener('click', () => loadLogs(false));
    
    toggleAutoBtn.addEventListener('click', () => {
        isAutoRefreshing = !isAutoRefreshing;
        if (isAutoRefreshing) {
            toggleAutoBtn.textContent = '⏸️ Pause Auto-Refresh';
            toggleAutoBtn.classList.remove('btn-success');
            toggleAutoBtn.classList.add('btn-warning');
            loadLogs(false);
        } else {
            toggleAutoBtn.textContent = '▶️ Start Auto-Refresh';
            toggleAutoBtn.classList.remove('btn-warning');
            toggleAutoBtn.classList.add('btn-success');
        }
    });
    
    clearAllBtn.addEventListener('click', () => {
        if (allLogs.length === 0) return alert("No logs to delete");
        deleteLogs(allLogs.map(l => l.id), `⚠️ Delete ALL ${allLogs.length} logs from <strong>${currentCollection}</strong>?<br>Other collections are NOT affected.`);
    });
    
    deleteSelectedBtn.addEventListener('click', () => {
        if (selectedLogs.size === 0) return;
        deleteLogs(Array.from(selectedLogs), `⚠️ Delete ${selectedLogs.size} selected log(s) from <strong>${currentCollection}</strong>?`);
    });
    
    selectAllCheckbox.addEventListener('change', (e) => {
        if (e.target.checked) {
            filteredLogs.forEach(log => selectedLogs.add(log.id));
        } else {
            filteredLogs.forEach(log => selectedLogs.delete(log.id));
        }
        renderTable(false);
        updateBatchControls();
    });
    
    collectionSelect.addEventListener('change', async (e) => {
        currentCollection = e.target.value;
        selectedLogs.clear();
        await loadLogs(false);
    });
    
    searchInput.addEventListener('input', () => applyFilters(false));
    
    document.getElementById('confirmYes').addEventListener('click', () => {
        if (window.currentModalAction) window.currentModalAction();
        document.getElementById('confirmModal').style.display = 'none';
    });
    document.getElementById('confirmNo').addEventListener('click', () => {
        document.getElementById('confirmModal').style.display = 'none';
    });
    
    function escapeHtml(str) {
        if (!str) return '—';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Start auto-refresh on load
    startAutoRefresh();
    loadLogs(false);
</script>
</body>
</html>
