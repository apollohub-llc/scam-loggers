<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Firebase Analytics Injector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c15;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #11141f;
            border-radius: 1.5rem;
            padding: 2rem;
            border: 1px solid #2a2f42;
        }
        h1 { font-size: 1.8rem; color: #e2e8f0; margin-bottom: 0.5rem; }
        .badge {
            display: inline-block;
            background: #1e2a4a;
            color: #60a5fa;
            padding: 0.2rem 0.7rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            margin-bottom: 1rem;
        }
        .sub { color: #8b9ab0; margin-bottom: 1.8rem; border-left: 3px solid #3b82f6; padding-left: 0.8rem; font-size: 0.85rem; }
        .row {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .col {
            flex: 1;
            min-width: 280px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #cbd5e6;
            margin-bottom: 0.4rem;
            margin-top: 1rem;
        }
        label:first-of-type { margin-top: 0; }
        input, textarea, select {
            width: 100%;
            background: #0c0f18;
            border: 1px solid #2a2f42;
            border-radius: 0.8rem;
            padding: 0.7rem 1rem;
            font-size: 0.85rem;
            color: #f1f5f9;
            font-family: monospace;
        }
        textarea {
            min-height: 280px;
            font-family: monospace;
            font-size: 0.75rem;
            resize: vertical;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            background: #1e2a4a;
            border: none;
            border-radius: 2rem;
            padding: 0.8rem 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.1s;
            width: 100%;
        }
        button:hover {
            background: #2d3f66;
            transform: scale(0.98);
        }
        .output-area {
            margin-top: 1.5rem;
            background: #0b0e17;
            border-radius: 1rem;
            padding: 1.2rem;
            border: 1px solid #2d3748;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .copy-btn {
            background: #1a253f;
            padding: 0.4rem 1rem;
            width: auto;
            margin: 0;
            font-size: 0.75rem;
        }
        .status {
            font-size: 0.7rem;
            margin-top: 0.5rem;
            color: #9aa3bb;
        }
        .status.success { color: #86efac; }
        .status.error { color: #f87171; }
        hr { margin: 1.5rem 0; border-color: #252a3a; }
        .feature-tip {
            font-size: 0.7rem;
            color: #5b6d8f;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔥 Firebase Analytics Injector</h1>
    <div class="badge">Firestore Backend • Works Immediately</div>
    <div class="sub">Inject visitor analytics into any HTML — data stored in your Firestore database.</div>

    <div class="row">
        <div class="col">
            <label>🏢 Location Name (mall/store identifier)</label>
            <input type="text" id="locationName" placeholder="e.g., Westfield Mall - Food Court">
            
            <label>📁 Firestore Collection Name</label>
            <input type="text" id="collectionName" placeholder="e.g., mall_visitors" value="visitor_analytics">
            
            <label>🎯 Analytics Mode</label>
            <select id="analyticsMode">
                <option value="full">Full Location (GPS + IP + Device)</option>
                <option value="ip-only">IP-Based Only (city/country)</option>
                <option value="anonymous">Anonymous (no location, just visit count)</option>
            </select>

            <label>📋 Your HTML Source Code</label>
            <textarea id="sourceCode" placeholder="Paste your full HTML code here..."></textarea>
        </div>
        <div class="col">
            <label>✨ Generated Code (copy & paste into your website)</label>
            <div class="output-area">
                <div class="output-header">
                    <span style="font-size:0.7rem; color:#7e8aa8;">📦 HTML WITH FIREBASE ANALYTICS</span>
                    <button id="copyOutputBtn" class="copy-btn">📋 Copy Code</button>
                </div>
                <textarea id="outputCode" readonly style="min-height: 400px; font-size: 0.7rem;"></textarea>
                <div class="status" id="statusMsg">Ready — paste your HTML, set location, then generate.</div>
            </div>
        </div>
    </div>
    <button id="generateBtn">🚀 GENERATE ANALYTICS-EMBEDDED CODE</button>
    <hr>
    <div style="font-size: 0.65rem; text-align: center; color: #4a5578;">
        📍 Uses your existing Firebase project (website-templates-60c6d)
    </div>
</div>

<script>
    // YOUR FIREBASE CONFIG (same as link logger)
    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyDp8UzNz8BqjDfbVd_xUdXL_4KqXWi3VrI",
        authDomain: "website-templates-60c6d.firebaseapp.com",
        projectId: "website-templates-60c6d",
        storageBucket: "website-templates-60c6d.firebasestorage.app",
        messagingSenderId: "799034936266",
        appId: "1:799034936266:web:d0954b442aafd895a5dd33",
        measurementId: "G-BKK5Y8F4HT"
    };

    const locationNameInput = document.getElementById('locationName');
    const collectionNameInput = document.getElementById('collectionName');
    const analyticsModeSelect = document.getElementById('analyticsMode');
    const sourceCodeInput = document.getElementById('sourceCode');
    const outputCodeTextarea = document.getElementById('outputCode');
    const generateBtn = document.getElementById('generateBtn');
    const copyOutputBtn = document.getElementById('copyOutputBtn');
    const statusSpan = document.getElementById('statusMsg');

    function generateInjectedHTML(originalHTML, collectionName, locationName, mode) {
        const analyticsScript = `<!-- Firebase Analytics Injection -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "${FIREBASE_CONFIG.apiKey}",
        authDomain: "${FIREBASE_CONFIG.authDomain}",
        projectId: "${FIREBASE_CONFIG.projectId}",
        storageBucket: "${FIREBASE_CONFIG.storageBucket}",
        messagingSenderId: "${FIREBASE_CONFIG.messagingSenderId}",
        appId: "${FIREBASE_CONFIG.appId}"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const COLLECTION = "${collectionName}";
    const LOCATION = "${locationName}";
    const MODE = "${mode}";
    
    async function sendAnalytics() {
        const data = {
            location: LOCATION,
            timestamp: new Date().toISOString(),
            pageUrl: window.location.href,
            referrer: document.referrer || "direct",
            userAgent: navigator.userAgent,
            screenSize: \`\${window.screen.width}x\${window.screen.height}\`,
            deviceType: /Mobile|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? "mobile" : "desktop"
        };
        
        if (MODE === 'full' || MODE === 'ip-only') {
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) {
                    const geo = await res.json();
                    data.ip = geo.ip;
                    data.city = geo.city;
                    data.country = geo.country_name;
                    data.isp = geo.org;
                    data.latitude = geo.latitude;
                    data.longitude = geo.longitude;
                }
            } catch(e) {}
        }
        
        if (MODE === 'full' && 'geolocation' in navigator) {
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
                });
                data.gpsLatitude = pos.coords.latitude;
                data.gpsLongitude = pos.coords.longitude;
                data.gpsAccuracy = pos.coords.accuracy;
            } catch(e) {}
        }
        
        try {
            await addDoc(collection(db, COLLECTION), data);
            console.log("✅ Analytics saved");
        } catch(e) {
            console.error("Firebase error:", e);
        }
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', sendAnalytics);
    } else {
        sendAnalytics();
    }
<\/script>
<!-- End Firebase Analytics -->`;

        if (originalHTML.includes('</head>')) {
            return originalHTML.replace('</head>', analyticsScript + '\n</head>');
        }
        if (originalHTML.includes('<body')) {
            return originalHTML.replace(/<body[^>]*>/i, (match) => match + '\n' + analyticsScript);
        }
        return analyticsScript + '\n' + originalHTML;
    }

    generateBtn.addEventListener('click', () => {
        const collectionName = collectionNameInput.value.trim();
        const locationName = locationNameInput.value.trim();
        const mode = analyticsModeSelect.value;
        const sourceHTML = sourceCodeInput.value.trim();

        if (!collectionName) {
            statusSpan.innerText = "❌ Collection name required";
            statusSpan.className = "status error";
            return;
        }
        if (!locationName) {
            statusSpan.innerText = "❌ Location name required";
            statusSpan.className = "status error";
            return;
        }
        if (!sourceHTML) {
            statusSpan.innerText = "❌ Paste your HTML source code";
            statusSpan.className = "status error";
            return;
        }

        try {
            const finalHTML = generateInjectedHTML(sourceHTML, collectionName, locationName, mode);
            outputCodeTextarea.value = finalHTML;
            statusSpan.innerText = "✅ Generated! Data goes to your Firestore → " + collectionName;
            statusSpan.className = "status success";
        } catch (error) {
            statusSpan.innerText = "❌ Error: " + error.message;
            statusSpan.className = "status error";
        }
    });

    copyOutputBtn.addEventListener('click', () => {
        outputCodeTextarea.select();
        navigator.clipboard.writeText(outputCodeTextarea.value);
        statusSpan.innerText = "📋 Copied!";
        setTimeout(() => {
            statusSpan.innerText = "✅ Generated! Data goes to your Firestore";
        }, 2000);
    });

    sourceCodeInput.placeholder = `<!DOCTYPE html>
<html>
<head>
    <title>My Page</title>
</head>
<body>
    <h1>Welcome</h1>
</body>
</html>`;
</script>
</body>
</html>
