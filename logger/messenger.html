<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Generator & Messenger Document Escaper</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #252538;
            --accent-color: #cba6f7;
            --text-color: #cdd6f4;
            --btn-success: #a6e3a1;
            --btn-copy: #89b4fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
        }

        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0; /* Prevents flex items from overflowing */
        }

        .panel {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        textarea {
            flex: 1;
            background: #11111b;
            color: #a6e3a1;
            border: 1px solid #45475a;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        #generateBtn {
            background-color: var(--accent-color);
            color: #11111b;
        }

        #copyBtn {
            background-color: var(--btn-copy);
            color: #11111b;
            display: none;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--btn-success);
            color: #11111b;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h2>In-App Browser Escaper & HTML Generator</h2>
    
    <div class="container">
        <!-- Input Panel -->
        <div class="panel">
            <h3>Input HTML / Doctype</h3>
            <textarea id="inputCode" placeholder="Paste your HTML code or <!DOCTYPE html> here..."></textarea>
            <div class="actions">
                <button id="generateBtn" onclick="generateEscaperCode()">Generate Output</button>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="panel">
            <h3>Modified Output</h3>
            <textarea id="outputCode" readonly placeholder="Your modified code will appear here..."></textarea>
            <div class="actions">
                <button id="copyBtn" onclick="copyToClipboard()">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Copied successfully!</div>

    <script>
        // The payload script that will be injected into the user's HTML.
        // It checks user agents and triggers a download or intent scheme to break out of Messenger/Facebook sandboxes.
        const escaperScript = `
    <!-- START MESSENGER ESCAPE SANDBOX SCRIPT -->
    <script>
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isMessenger = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1);
            
            if (isMessenger) {
                // Strategy for Android: Trigger a deep link intent to Chrome
                if (/Android/i.test(ua)) {
                    var currentUrl = window.location.href;
                    // Removes http:// or https:// to format for intent
                    var cleanUrl = currentUrl.replace(/^https?:\\/\\//, ""); 
                    window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
                } 
                // Strategy for iOS: iOS Messenger is notoriously restrictive. 
                // A common workaround is prompting a file download or opening an external application scheme if available.
                else if (/iPhone|iPad|iPod/i.test(ua)) {
                    // Alternative fallback UI warning for iOS users inside Messenger
                    var msgDiv = document.createElement('div');
                    msgDiv.style = "position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:999999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;box-sizing:border-box;font-family:sans-serif;";
                    msgDiv.innerHTML = "<h2>Please Open in External Browser</h2><p>Messenger's built-in browser restricts features. Tap the <b>three dots (...)</b> or <b>Compass icon</b> at the top right or bottom right, and select <b>'Open in Safari'</b> or <b>'Open in Chrome'</b>.</p>";
                    document.documentElement.appendChild(msgDiv);
                }
            }
        })();
    <\\/script>
    <!-- END MESSENGER ESCAPE SANDBOX SCRIPT -->
`;

        function generateEscaperCode() {
            const rawInput = document.getElementById('inputCode').value.trim();
            const outputTextarea = document.getElementById('outputCode');
            const copyBtn = document.getElementById('copyBtn');

            if (!rawInput) {
                alert("Please paste some HTML code first!");
                return;
            }

            let modifiedHTML = "";

            // Check if input has a <head> tag to cleanly inject into
            if (rawInput.toLowerCase().includes("<head>")) {
                modifiedHTML = rawInput.replace(/(<head[^>]*>)/i, `$1\n${escaperScript}`);
            } 
            // Check if it's just a doctype or missing <head> but has <html>
            else if (rawInput.toLowerCase().includes("<html")) {
                modifiedHTML = rawInput.replace(/(<html[^>]*>)/i, `$1\n<head>\n${escaperScript}\n</head>`);
            }
            // If it's fragmented code or just raw elements, prepend the script
            else {
                modifiedHTML = escaperScript + "\n" + rawInput;
            }

            outputTextarea.value = modifiedHTML;
            copyBtn.style.display = "block";
        }

        function copyToClipboard() {
            const outputTextarea = document.getElementById('outputCode');
            outputTextarea.select();
            outputTextarea.setSelectionRange(0, 99999); // For mobile devices

            navigator.clipboard.writeText(outputTextarea.value).then(() => {
                showToast();
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }
    </script>
</body>
</html>
