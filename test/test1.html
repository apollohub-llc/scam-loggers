<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scammer Hub</title>
    <style>
        body, html { 
            margin:0; padding:0; width:100%; min-height:100%; overflow-x:hidden; 
            background:#fff; font-family: sans-serif; 
        }
        
        #site-canvas { 
            position:relative; width:100%; max-width:1440px; height:1800px; 
            background-image:url("https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%3Fid%3DOIP.0gtDydRfHyNl0ocnAYRyOAHaEc%26pid%3DApi&f=1&ipt=b623b623ffee5cc9b46ab949dd634b5cf7d494e56251b5c91a7a1697d0981b88&ipo=images"); 
            background-size:cover; background-position:center; 
            margin:0 auto; overflow:hidden; 
        }
        
        .dropped-element { 
            position:absolute; display:flex; align-items:center; justify-content:center; box-sizing: border-box; 
        }

        .scammer-name-text {
            font-size: 38px !important;
            color: #ff6600;
            background-image: url("https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse2.mm.bing.net%2Fth%3Fid%3DOIP.zD0TYGY1gkPG974wz1AiYgHaHa%26pid%3DApi&f=1&ipt=b29c01575d4ddfbee33e184d3a5d16b4f867db3ef3b326aad0b20b09a868e99d&ipo=images");
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: cover;
            margin: 0;
            font-weight: bold;
            text-align: center;
            width: 100%;
        }

        /* Desktop Layout */
        @media (min-width: 601px) {
            #el-0 { left:1.5%; top:10px; width:30%; height:70px; z-index:50; }
            #el-10 { left:6.7%; top:275px; width:37%; height:52px; z-index:50; }
            #el-11 { left:45%; top:255px; width:10%; height:85px; z-index:50; }
            #el-3 { left:5%; top:380px; width:90%; height:1350px; z-index:10; overflow-y: auto; display: block; }
        }

        /* Mobile Layout */
        @media (max-width: 600px) {
            #el-0 { left:5%; top:20px; width:90%; height:70px; z-index:100; }
            #el-10 { left:5%; top:120px; width:70%; height:50px; }
            #el-11 { left:78%; top:105px; width:18%; height:75px; }
            #el-3 { left:5%; top:220px; width:90%; height:1400px; overflow-y: auto; display: block; }
            .scammer-name-text { font-size: 32px !important; }
            .scammer-card { height: auto !important; margin-bottom: 30px; }
            .scammer-content { flex-direction: column; align-items: center; text-align: center; padding: 20px; gap: 15px; }
            .scammer-content img { width: 110px; height: 110px; margin: 0 !important; }
            .scammer-content button { width: 100% !important; max-width: 280px; padding: 14px 20px !important; font-size: 17px !important; }
        }

        .scammer-card { position:relative; width:100%; margin-bottom: 40px; }
        .scammer-bg { position:absolute; inset:0; border: 2px solid #333; background: rgba(0,0,0,0.05); border-radius: 12px; z-index: 1; }
        .scammer-content { position:relative; z-index: 2; padding: 20px; display: flex; justify-content: space-between; height: 100%; box-sizing: border-box; }
        
        textarea { resize: none; border-radius: 12px; padding: 10px; width: 100%; height: 100%; font-size: 14px; }
        button { cursor: pointer; border: none; border-radius: 12px; transition: transform 0.1s; }
    </style>
</head>
<body>

<div id="site-canvas">
    <div id="el-0" class="dropped-element">
        <h2 class="scammer-name-text">𝕊𝕔𝕒𝕞𝕞𝕖𝕣 ℍ𝕦𝕓</h2>
    </div>

    <div id="el-10" class="dropped-element">
        <textarea id="user-input" placeholder="Search for a name..."></textarea>
    </div>

    <div id="el-11" class="dropped-element">
        <button id="search-trigger" style="background: url('https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%3Fid%3DOIP.0KdLlMlStFZ0B0USCObivAHaEk%26pid%3DApi&f=1&ipt=05455448d2ed135438a4d56f9e7a141d0335ac31cca8deec0a1488da7c41d2f0&ipo=images') center/cover; color: white; width:100%; height:100%;">🔍</button>
    </div>

    <div id="el-3" class="dropped-element">
        <div id="fire-list" style="width:100%;"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Fetching variables from the environment
const firebaseConfig = {
  apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
  authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
  projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
  storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
  messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
  appId: import.meta.env.VITE_FIREBASE_APP_ID
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const scammerCol = collection(db, "scammers");

const listDiv = document.getElementById('fire-list');
const searchInput = document.getElementById('user-input');
const searchBtn = document.getElementById('search-trigger');

let cache = [];

onSnapshot(scammerCol, (snap) => {
    cache = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render(cache);
});

function render(data) {
    listDiv.innerHTML = '';
    data.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'scammer-card';
        div.innerHTML = `
            <div class="scammer-bg"></div>
            <div class="scammer-content">
                <div>
                    <h2 class="scammer-name-text">${i + 1}. ${item.name}</h2>
                </div>
                <img src="${item.imageUrl || 'https://via.placeholder.com/150'}" 
                     style="width:120px; height:120px; border-radius:12px; object-fit:cover;">
                <button style="margin-top:10px; padding: 12px 20px; background: #4f46e5; color: white; font-size: 18px;" 
                        onclick="window.open('${item.redirectUrl}', '_blank')">𝐕𝐢𝐞𝐰 𝐏𝐫𝐨𝐟𝐢𝐥𝐞</button>
            </div>
        `;
        listDiv.appendChild(div);
    });
}

searchBtn.addEventListener('click', () => {
    const val = searchInput.value.toLowerCase();
    render(cache.filter(s => s.name.toLowerCase().includes(val)));
});
</script>

</body>
</html>
