<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Hybrid IntelXYZ</title>
  <style>
    :root {
      --bg: #0a0d12;
      --panel-bg: #111622;
      --border: #1e293b;
      --accent: #00ff66;
      --accent-glow: rgba(0, 255, 102, 0.2);
      --text: #e2e8f0;
      --muted: #64748b;
      --danger: #ff4757;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      border-bottom: 2px solid var(--accent);
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      color: var(--accent);
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .badge {
      background: var(--accent);
      color: #000;
      padding: 4px 8px;
      font-weight: bold;
      border-radius: 3px;
      font-size: 0.8rem;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .container { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      height: fit-content;
    }

    .panel h2 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 15px;
      text-transform: uppercase;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 5px;
    }

    .form-group { margin-bottom: 12px; }

    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }

    input, select {
      width: 100%;
      padding: 10px;
      background: #07090e;
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 4px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent); }

    button {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      transition: 0.2s;
    }

    button:hover { opacity: 0.9; box-shadow: 0 0 10px var(--accent-glow); }

    .search-bar { margin-bottom: 20px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 15px;
      border-radius: 4px;
      position: relative;
    }

    .card-title {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .card-field {
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text);
    }

    .card-field span { color: var(--muted); }

    .copy-btn {
      margin-top: 10px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 6px;
    }

    .copy-btn:hover {
      background: var(--accent);
      color: #000;
    }

    .status {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>EV Hybrid IntelXYZ</h1>
    <div><span class="badge">DATABASE ACTIVE</span></div>
  </header>

  <div class="container">
    <!-- INPUT PANEL -->
    <div class="panel">
      <h2>Add Intel Entry</h2>
      <form id="intelForm">
        <div class="form-group">
          <label>NAME / AKA</label>
          <input type="text" id="name" placeholder="John Doe (aka Hunter)" required>
        </div>
        <div class="form-group">
          <label>AGE</label>
          <input type="text" id="age" placeholder="25" required>
        </div>
        <div class="form-group">
          <label>GENDER</label>
          <input type="text" id="gender" placeholder="Male / Female" required>
        </div>
        <div class="form-group">
          <label>ADDRESS / COORDINATES</label>
          <input type="text" id="address" placeholder="12.34N 56.78E, Sector 7" required>
        </div>
        <div class="form-group">
          <label>CLASSIFICATION / PERPETRATOR TYPE</label>
          <input type="text" id="classification" placeholder="Scammer / Malicious Actor" required>
        </div>
        <button type="submit">Inject Record</button>
      </form>
      <div id="status" class="status">Status: Standby</div>
    </div>

    <!-- HOME / MAIN DATABASE -->
    <div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="⚡ Search database by Name, Location, or Type...">
      </div>

      <div class="grid" id="cardGrid"></div>
    </div>
  </div>

  <script>
    const records = [];

    // Fetch files listed in storage.txt
    async function loadStorage() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Status: Reading storage.txt...';
      try {
        const res = await fetch('storage.txt');
        if (!res.ok) throw new Error('storage.txt not found');
        const text = await res.text();
        
        // Extract non-empty lines (handles subfolders like "folder/file.txt")
        const fileList = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        for (const filePath of fileList) {
          try {
            const fileRes = await fetch(filePath);
            if (fileRes.ok) {
              const fileContent = await fileRes.text();
              parseAndAddRecord(fileContent);
            }
          } catch (e) {
            console.warn(`Could not load target file: ${filePath}`);
          }
        }
        statusEl.textContent = `Status: Loaded ${records.length} records.`;
      } catch (err) {
        statusEl.textContent = 'Status: Manual mode (No storage.txt found)';
      }
    }

    // Parse specific TXT format
    function parseAndAddRecord(rawText) {
      const name = rawText.match(/Name:\s*(.+)/i)?.[1] || 'Unknown';
      const age = rawText.match(/Age:\s*(.+)/i)?.[1] || 'N/A';
      const gender = rawText.match(/Gender:\s*(.+)/i)?.[1] || 'N/A';
      const address = rawText.match(/Address:\s*(.+)/i)?.[1] || 'N/A';
      const classification = rawText.match(/Classification:\s*(.+)/i)?.[1] || 'Unclassified';

      records.push({ name, age, gender, address, classification });
      renderGrid();
    }

    // Render Cards
    function renderGrid(filter = '') {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      const filtered = records.filter(r => 
        Object.values(r).some(val => val.toLowerCase().includes(filter.toLowerCase()))
      );

      filtered.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">${item.name}</div>
          <div class="card-field"><span>Age:</span> ${item.age}</div>
          <div class="card-field"><span>Gender:</span> ${item.gender}</div>
          <div class="card-field"><span>Address:</span> ${item.address}</div>
          <div class="card-field"><span>Type:</span> ${item.classification}</div>
          <button class="copy-btn" onclick="copyCardInfo(${index})">📋 Copy Info</button>
        `;
        grid.appendChild(card);
      });
    }

    // Copy formatted info to clipboard
    function copyCardInfo(index) {
      const item = records[index];
      const textToCopy = `[EV INTEL FILE]\nName: ${item.name}\nAge: ${item.age}\nGender: ${item.gender}\nAddress: ${item.address}\nClassification: ${item.classification}`;
      navigator.clipboard.writeText(textToCopy);
      alert(`Copied record for: ${item.name}`);
    }

    // Form submission
    document.getElementById('intelForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const newRecord = {
        name: document.getElementById('name').value,
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value,
        address: document.getElementById('address').value,
        classification: document.getElementById('classification').value,
      };
      records.unshift(newRecord);
      renderGrid();
      e.target.reset();
    });

    // Search filter listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderGrid(e.target.value);
    });

    // Initialize
    loadStorage();
  </script>
</body>
</html>
