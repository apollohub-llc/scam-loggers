<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Watchers</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Orbitron', 'Courier New', monospace;
            background-color: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #222;
        }
        
        .logo {
            font-size: 2.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #00ff41;
            margin-bottom: 0.5rem;
        }
        
        .tagline {
            font-size: 1.1rem;
            color: #888;
            letter-spacing: 0.05em;
        }
        
        /* Search Box */
        .search-wrapper {
            max-width: 600px;
            margin: 0 auto 4rem;
        }

        .search-box {
            display: flex;
            background: #12121a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .search-input {
            flex: 1;
            padding: 1rem 1.2rem;
            background: transparent;
            border: none;
            font-size: 1rem;
            color: #e0e0e0;
            font-family: inherit;
            outline: none;
        }
        
        .search-input::placeholder {
            color: #666;
        }
        
        .search-btn {
            background: #00aa33;
            color: #fff;
            border: none;
            padding: 1rem 1.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: background 0.3s ease;
        }
        
        .search-btn:hover {
            background: #00cc44;
        }
        
        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        
        /* Scammer Card Container — exactly what you asked */
        .scammer-card {
            background: #12121a;
            border: 1px solid #222;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .scammer-card:hover {
            transform: translateY(-5px);
            border-color: #00ff41;
        }
        
        .profile-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #1a1a25;
        }
        
        .profile-info {
            padding: 1.5rem;
            text-align: center;
        }
        
        .scammer-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00ff41;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        
        .view-profile {
            display: inline-block;
            background: #00aa33;
            color: #fff;
            padding: 0.7rem 1.6rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: background 0.3s ease;
        }
        
        .view-profile:hover {
            background: #00cc44;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }
            
            .search-box {
                flex-direction: column;
            }

            .search-btn {
                padding: 0.8rem;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.8rem;
            }
            
            .logo {
                font-size: 1.7rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">Evidence Watchers</h1>
            <p class="tagline">We are anonymous.
Same as you</p>
        </header>
        
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" class="search-input" id="user-input" placeholder="Enter scammer name...">
                <button class="search-btn" id="search-trigger">Search</button>
            </div>
        </div>
        
        <div class="results-grid" id="fire-list">
            <!-- Example Scammer Card — all content inside its own container -->
            <div class="scammer-card">
                <img src="https://via.placeholder.com/300x200" alt="Scammer Profile" class="profile-image">
                <div class="profile-info">
                    <h3 class="scammer-name">Loading...</h3>
                    <a href="#" class="view-profile">View Profile</a>
                </div>
            </div>

            <div class="scammer-card">
                <img src="https://via.placeholder.com/300x200" alt="Scammer Profile" class="profile-image">
                <div class="profile-info">
                    <h3 class="scammer-name">loading...</h3>
                    <a href="#" class="view-profile">View Profile</a>
                </div>
            </div>
        </div>
    </div>

 <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Directly using your Firebase config values
const firebaseConfig = {
  apiKey: "AIzaSyDY_qdBhl3OV_Poxw4hUinGkuaVudybQEU",
  authDomain: "scammer-hubby.firebaseapp.com",
  projectId: "scammer-hubby",
  storageBucket: "scammer-hubby.firebasestorage.app",
  messagingSenderId: "343577013334",
  appId: "1:343577013334:web:9d495ca0342ea3972f1ff7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const scammerCol = collection(db, "scammers");

const listDiv = document.getElementById('fire-list');
const searchInput = document.getElementById('user-input');
const searchBtn = document.getElementById('search-trigger');

let cache = [];

onSnapshot(scammerCol, (snap) => {
    cache = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render(cache);
});

function render(data) {
    listDiv.innerHTML = '';
    data.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'scammer-card';
        card.innerHTML = `
            <img src="${item.imageUrl || 'https://via.placeholder.com/150'}" alt="Profile">
            <h3>${item.name}</h3>
            <p>${item.description || 'Reported Scammer'}</p>
            <a href="${item.redirectUrl || '#'}" target="_blank" class="view-btn">View Profile</a>
        `;
        listDiv.appendChild(card);
    });
}

const filterResults = () => {
    const val = searchInput.value.toLowerCase();
    const filtered = cache.filter(s => s.name.toLowerCase().includes(val));
    render(filtered);
};

searchBtn.addEventListener('click', filterResults);
searchInput.addEventListener('input', filterResults);
</script>

</body>
</html>
