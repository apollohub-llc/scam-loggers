<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamHub</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', 'Courier New', monospace;
            background: #000;
            color: #00ff41;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0,255,65,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0,255,65,0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0,255,65,0.15) 0%, transparent 50%);
            z-index: -1;
            animation: pulse 4s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .logo {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: linear-gradient(45deg, #00ff41, #00cc33, #00ff41);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 
                0 0 10px #00ff41,
                0 0 20px #00ff41,
                0 0 30px #00ff41;
            margin: 0;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { filter: drop-shadow(0 0 10px #00ff41); }
            to { filter: drop-shadow(0 0 20px #00ff41); }
        }
        
        .tagline {
            font-size: 1.2rem;
            opacity: 0.8;
            margin: 0.5rem 0 0 0;
            letter-spacing: 0.05em;
        }
        
        .search-box {
            display: flex;
            max-width: 700px;
            margin: 0 auto 3rem;
            background: rgba(0,0,0,0.8);
            border: 2px solid #00ff41;
            border-radius: 15px;
            box-shadow: 
                0 0 20px rgba(0,255,65,0.5),
                inset 0 0 20px rgba(0,255,65,0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .search-input {
            flex: 1;
            padding: 1.5rem 2rem;
            background: transparent;
            border: none;
            font-size: 1.2rem;
            color: #00ff41;
            font-family: inherit;
            outline: none;
        }
        
        .search-input::placeholder {
            color: rgba(0,255,65,0.6);
        }
        
        .search-btn {
            background: linear-gradient(45deg, #00ff41, #00cc33);
            color: #000;
            border: none;
            padding: 1.5rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0,255,65,0.6);
        }
        
        .search-btn:hover {
            background: linear-gradient(45deg, #00cc33, #00ff41);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0,255,65,0.8);
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }
        
        .profile-card {
            background: rgba(0,0,0,0.9);
            border: 2px solid #00ff41;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 0 30px rgba(0,255,65,0.4),
                inset 0 0 20px rgba(0,255,65,0.1);
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00ff41, #00cc33, #00ff41);
        }
        
        .profile-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 
                0 0 50px rgba(0,255,65,0.7),
                inset 0 0 30px rgba(0,255,65,0.2);
        }
        
        .profile-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 2px solid rgba(0,255,65,0.3);
            position: relative;
        }
        
        .profile-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00ff41, transparent);
        }
        
        .profile-info {
            padding: 2rem;
            text-align: center;
        }
        
        .profile-name {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-shadow: 0 0 10px rgba(0,255,65,0.8);
        }
        
        .profile-status {
            color: rgba(0,255,65,0.7);
            font-size: 0.95rem;
            margin: 0 0 1.5rem 0;
            font-weight: 500;
            letter-spacing: 0.03em;
        }
        
        .view-profile {
            display: inline-block;
            background: linear-gradient(45deg, #00ff41, #00cc33);
            color: #000;
            padding: 1rem 2.5rem;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 0 20px rgba(0,255,65,0.6);
            transition: all 0.3s ease;
        }
        
        .view-profile:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0,255,65,0.9);
        }
        
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.5rem;
            }
            
            .logo {
                font-size: 2rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">Evidence Watchers</h1>
            <p class="tagline">Powered by Evidence Watchers</p>
        </header>
        
        <div class="search-box">
            <input type="text" class="search-input" id="user-input" placeholder="Enter scammer name...">
            <button class="search-btn" id="search-trigger">Search</button>
        </div>
        
        <div class="results-grid" id="fire-list">
            <!-- Targets appear here -->
        </div>
    </div>
    
    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Directly using your Firebase config values
const firebaseConfig = {
  apiKey: "AIzaSyDY_qdBhl3OV_Poxw4hUinGkuaVudybQEU",
  authDomain: "scammer-hubby.firebaseapp.com",
  projectId: "scammer-hubby",
  storageBucket: "scammer-hubby.firebasestorage.app",
  messagingSenderId: "343577013334",
  appId: "1:343577013334:web:9d495ca0342ea3972f1ff7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const scammerCol = collection(db, "scammers");

const listDiv = document.getElementById('fire-list');
const searchInput = document.getElementById('user-input');
const searchBtn = document.getElementById('search-trigger');

let cache = [];

onSnapshot(scammerCol, (snap) => {
    cache = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render(cache);
});

function render(data) {
    listDiv.innerHTML = '';
    data.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'scammer-card';
        card.innerHTML = `
            <img src="${item.imageUrl || 'https://via.placeholder.com/150'}" alt="Profile">
            <h3>${item.name}</h3>
            <p>${item.description || 'Reported Scammer'}</p>
            <a href="${item.redirectUrl || '#'}" target="_blank" class="view-btn">View Profile</a>
        `;
        listDiv.appendChild(card);
    });
}

const filterResults = () => {
    const val = searchInput.value.toLowerCase();
    const filtered = cache.filter(s => s.name.toLowerCase().includes(val));
    render(filtered);
};

searchBtn.addEventListener('click', filterResults);
searchInput.addEventListener('input', filterResults);
</script>
    
</body>
</html>
